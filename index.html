.sync-bar{background:#0f172a;padding:5px 16px;font-size:11px;display:flex;align-items:center;gap:6px;}
.sync-dot{width:7px;height:7px;border-radius:50%;background:#94a3b8;flex-shrink:0;}

.sync-dot.err{background:#ef4444;}

#main{flex:1;display:flex;flex-direction:column;overflow:hidden;}

.pl{background:#f0fdf4;color:#16a34a;}
.card{background:#fff;border-radius:10px;padding:18px 20px;margin-bottom:14px;box-shadow:0 1px 3px rgba(0,0,0,.05);}

.btn{display:inline-flex;align-items:center;gap:5px;padding:7px 13px;border-radius:7px;font-size:13px;cursor:pointer;border:none;font-weight:500;transition:.15s;}
.btn-primary{background:#3b82f6;color:#fff;}.btn-primary:hover{background:#2563eb;}
.btn-danger{background:#ef4444;color:#fff;}.btn-danger:hover{background:#dc2626;}
.btn-success{background:#10b981;color:#fff;}.btn-success:hover{background:#059669;}
.btn-outline{background:#fff;color:#374151;border:1px solid #d1d5db;}.btn-outline:hover{background:#f9fafb;}

.chat-msg.mine{flex-direction:row-reverse;align-self:flex-end;}

.chat-msg .text{font-size:13px;line-height:1.5;}

.col-map{display:grid;grid-template-columns:1fr 1fr;gap:8px;}

.inline-select:focus{outline:2px solid #3b82f6;outline-offset:1px;}

/* 4단계 파이프라인 미니바 */

.pipe-step.done{opacity:1;}
.pipe-step.pending{background:#f1f5f9;color:#94a3b8;}
.pipe-arrow{color:#cbd5e1;font-size:10px;flex-shrink:0;}

/* 칸반 보드 */

.kanban-col{background:#f8fafc;border-radius:10px;padding:10px;}
.kanban-col-header{font-size:11px;font-weight:700;margin-bottom:8px;display:flex;align-items:center;justify-content:space-between;}
.kanban-card{background:#fff;border-radius:7px;padding:8px 10px;margin-bottom:6px;box-shadow:0 1px 2px rgba(0,0,0,.06);cursor:pointer;transition:.15s;border-left:3px solid #e2e8f0;}
.kanban-card:hover{box-shadow:0 2px 8px rgba(0,0,0,.1);transform:translateY(-1px);}
.kanban-card .kc-name{font-size:12px;font-weight:600;margin-bottom:4px;color:#1e293b;}

.kc-dot{width:8px;height:8px;border-radius:2px;flex-shrink:0;}
</style>
</head>
<body>

<script>

// CLOUD SYNC
// ============================================================
function setSyncStatus(s){
  const dot=document.getElementById('syncDot');
  const txt=document.getElementById('syncStatus');
  if(!dot||!txt)return;
  if(s==='ok'){dot.className='sync-dot ok';txt.textContent='클라우드 연결됨';txt.style.color='#4ade80';}
  else if(s==='syncing'){dot.className='sync-dot syncing';txt.textContent='동기화 중...';txt.style.color='#fbbf24';}
  else if(s==='err'){dot.className='sync-dot err';txt.textContent='연결 오류';txt.style.color='#f87171';}
  else{dot.className='sync-dot';txt.textContent='클라우드 미연결';txt.style.color='#64748b';}
}
async function cloudSave(data){
  if(!API_URL)return;
  try{
    setSyncStatus('syncing');
    await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify({data,ts:Date.now()})});
    setSyncStatus('ok');
  }catch(e){setSyncStatus('err');}
}
async function cloudLoad(silent){
  if(!API_URL)return;
  if(!silent)setSyncStatus('syncing');
  try{
    const r=await fetch(API_URL+'?t='+Date.now());
    const json=await r.json();
    if(json.status==='ok'&&json.data){
      if(JSON.stringify(json.data)!==JSON.stringify(DB)){
        DB=json.data;localStorage.setItem(STORE_KEY,JSON.stringify(DB));renderPage();
      }
      setSyncStatus('ok');
    }
  }catch(e){setSyncStatus('err');}
}
function manualSync(){if(!API_URL){showApiSettings();return;}cloudLoad(false);}
function startSyncPolling(){
  if(syncInterval)clearInterval(syncInterval);
  if(!API_URL)return;
  syncInterval=setInterval(()=>cloudLoad(true),8000);
  cloudLoad(false);
}

function showApiSettings(){
  showModal(`<h2>☁️ 클라우드 동기화 설정</h2>
  <div class="alert-info">구글 앱스 스크립트 Web App URL을 등록하면 두 분의 데이터가 실시간으로 공유됩니다.</div>
  <div class="fg"><label>앱스 스크립트 Web App URL</label>
  <input id="apiUrlInput" value="${API_URL}" placeholder="https://script.google.com/macros/s/.../exec"></div>
  ${API_URL?`<div class="alert-success">✅ 현재 URL이 등록되어 있습니다.</div>`:''}
  <div class="modal-footer">
    <button class="btn btn-outline" onclick="closeModal()">취소</button>
    ${API_URL?`<button class="btn btn-danger btn-sm" onclick="clearApiUrl()" style="margin-right:auto">연결 해제</button>`:''}

  </div>`);

function saveApiUrl(){
  const url=(document.getElementById('apiUrlInput').value||'').trim();
  if(!url){alert('URL을 입력하세요.');return;}
  API_URL=url;localStorage.setItem(API_KEY_STORE,url);closeModal();startSyncPolling();
  alert('✅ 연결되었습니다!');
}
function clearApiUrl(){
  if(!confirm('연결을 해제하시겠습니까?'))return;
  API_URL='';localStorage.removeItem(API_KEY_STORE);
  if(syncInterval)clearInterval(syncInterval);setSyncStatus('none');closeModal();
}

function uid(){return 'id_'+Math.random().toString(36).substr(2,9)+'_'+Date.now();}
function nowStr(){const d=new Date();return`${d.getFullYear()}-${p2(d.getMonth()+1)}-${p2(d.getDate())} ${p2(d.getHours())}:${p2(d.getMinutes())}`;}
function p2(n){return String(n).padStart(2,'0');}
function username(id){return USERS[id]?USERS[id].name:id;}
function getProduct(id){return DB.products.find(p=>p.id===id);}
function unreadCount(){return DB.notifications.filter(n=>n.userId===currentUser.id&&!n.read).length;}

function ensureFields(p){
  if(!p.preInspect)p.preInspect='-';
  if(!p.preInspectDate)p.preInspectDate='';
  if(!p.preInspectReflect)p.preInspectReflect='검토파일미반영';
  if(!p.labelStatus)p.labelStatus='-';
  if(!p.labelReview)p.labelReview='-';
  if(!p.importDecl)p.importDecl='-';
  if(!p.itemNo)p.itemNo='';
  if(!p.reviewedBy)p.reviewedBy=null;
  if(!p.status||!STATUSES.includes(p.status))p.status='검토예정';
  return p;
}

function addNotif(userId,type,msg,productId){
  DB.notifications.unshift({id:uid(),userId,type,msg,productId,read:false,at:nowStr()});
  saveData(DB);updateNotifBadge();
}
function updateNotifBadge(){
  const cnt=unreadCount();
  const el=document.getElementById('nav-notif');if(!el)return;
  const ex=el.querySelector('.notif-count');if(ex)ex.remove();
  if(cnt>0){const s=document.createElement('span');s.className='notif-count';s.style.marginLeft='auto';s.textContent=cnt;el.appendChild(s);}
}

function sBadge(v){return`<span class="badge s-${v}">${v}</span>`;}
function piBadge(v){if(!v||v==='-')return`<span style="color:#94a3b8;font-size:12px">—</span>`;return`<span class="badge pi-${v}">${v}</span>`;}
function prBadge(v){return`<span class="badge pr-${v.replace(/\s/g,'')}">${v}</span>`;}
function labelBadge(v){if(!v||v==='-')return`<span style="color:#94a3b8;font-size:12px">—</span>`;return`<span class="badge lb-${v.replace(/\s/g,'')}">${v}</span>`;}
function idBadge(v){if(!v||v==='-')return`<span style="color:#94a3b8;font-size:12px">—</span>`;return`<span class="badge id-${v.replace(/\s/g,'')}">${v}</span>`;}

function renderPage(){
  document.getElementById('topbarDate').textContent=nowStr();

  document.getElementById('pageTitle').textContent=titles[currentPage]||'';
  const c=document.getElementById('content');
  if(currentPage==='dashboard')c.innerHTML=renderDashboard();
  else if(currentPage==='products')c.innerHTML=renderProductList();

      <select id="fl-id" onchange="filterList()" style="padding:6px 10px;border:1px solid #d1d5db;border-radius:7px;font-size:12px"><option value="">수입신고 전체</option>${ID_STATUSES.map(s=>`<option>${s}</option>`).join('')}</select>

      <tr><th><input type="checkbox" id="chk-all" onchange="toggleAllCheck(this.checked)" title="전체선택"></th><th>No.</th><th>제품명</th><th>1단계 검토상태</th><th>진행 파이프라인 (2~4단계)</th><th>잠금</th><th>작업</th></tr>
      <tbody id="product-tbody">${renderProductRows(DB.products.map(ensureFields))}</tbody>

function pipelineBar(p){
  const steps=[
    {label:'검토',val:p.status,colors:STATUS_COLORS,done:p.status==='검토완료'},
    {label:'사전검사',val:p.preInspect,colors:PI_COLORS,done:p.preInspect==='진행완료'||p.preInspect==='해당없음'},
    {label:'라벨',val:p.labelStatus,colors:LABEL_COLORS,done:p.labelStatus==='라벨 발송'},
    {label:'수입신고',val:p.importDecl,colors:ID_COLORS,done:p.importDecl==='신고완료'},
  ];
  return`<div class="pipeline">${steps.map((s,i)=>{
    const color=s.colors[s.val]||'#94a3b8';
    const bg=s.done?color:s.val&&s.val!=='-'?color+'33':'#f1f5f9';
    const fc=s.done?'#fff':s.val&&s.val!=='-'?color:'#94a3b8';
    return(i>0?`<span class="pipe-arrow">›</span>`:'')+
      `<div class="pipe-step" style="background:${bg};color:${fc}" title="${s.val||'미진행'}">${s.label}</div>`;
  }).join('')}</div>`;
}

function inlineStatusSelect(p){
  const locked=p.lockedBy&&p.lockedBy!==currentUser.id;
  if(locked)return sBadge(p.status);
  const bg=STATUS_COLORS[p.status]||'#94a3b8';
  return`<select class="inline-select" style="background:${bg}22;color:${bg};border:1px solid ${bg}66"
    onchange="inlineChangeStatus('${p.id}',this.value)" onclick="event.stopPropagation()">
    ${STATUSES.map(s=>`<option value="${s}" ${s===p.status?'selected':''}>${s}</option>`).join('')}
  </select>`;
}

function inlineChangeStatus(id,s){
  const p=getProduct(id);if(!p)return;
  if(p.lockedBy&&p.lockedBy!==currentUser.id){alert(`${username(p.lockedBy)}님이 검토중입니다.`);return;}
  const old=p.status;if(old===s)return;
  p.status=s;
  DB.history.push({id:uid(),productId:id,from:old,to:s,by:currentUser.id,at:nowStr(),note:'목록 인라인 변경'});
  if(s==='검토완료'){p.lockedBy=null;p.lockTime=null;}
  Object.values(USERS).forEach(u=>{if(u.id!==currentUser.id)addNotif(u.id,'status',`${p.name}: ${old}→${s}`,id);});
  saveData(DB);filterList();
}

function renderProductRows(prods){
  if(!prods.length)return`<tr><td colspan="10" class="empty">검색 결과가 없습니다.</td></tr>`;
  return prods.map(p=>`<tr>
    <td><input type="checkbox" class="row-chk" value="${p.id}"></td>
    <td style="font-size:11px;color:#64748b;white-space:nowrap">${p.itemNo||'—'}</td>
    <td><strong style="cursor:pointer;color:#2563eb" onclick="go('product','${p.id}')">${p.name}</strong><div style="font-size:10px;color:#94a3b8">${p.importer||''}</div></td>
    <td>${inlineStatusSelect(p)}</td>
    <td>${pipelineBar(p)}</td>
    <td style="white-space:nowrap">
      ${p.lockedBy&&p.lockedBy!==currentUser.id
        ?`<span class="chip lock-chip" style="font-size:10px">🔒 ${username(p.lockedBy)}</span>`
        :p.lockedBy===currentUser.id
        ?`<button class="btn btn-danger btn-sm" onclick="toggleLockFromList('${p.id}')">🔓 종료</button>`
        :`<button class="btn btn-success btn-sm" onclick="toggleLockFromList('${p.id}')">🔒 시작</button>`}
    </td>
    <td style="display:flex;gap:3px">
      <button class="btn btn-outline btn-sm" onclick="go('product','${p.id}')">상세</button>
      <button class="btn btn-danger btn-sm" onclick="deleteProduct('${p.id}')">삭</button>
    </td>
  </tr>`).join('');
}
function toggleAllCheck(checked){document.querySelectorAll('.row-chk').forEach(c=>c.checked=checked);}
function getCheckedIds(){return [...document.querySelectorAll('.row-chk:checked')].map(c=>c.value);}
function filterList(){
  const name=(document.getElementById('fl-name')||{}).value?.toLowerCase()||'';
  const status=(document.getElementById('fl-status')||{}).value||'';
  const lockFilter=(document.getElementById('fl-lock')||{}).value||'';
  const pi=(document.getElementById('fl-pi')||{}).value||'';
  const lb=(document.getElementById('fl-lb')||{}).value||'';
  const idv=(document.getElementById('fl-id')||{}).value||'';
  let prods=DB.products.map(ensureFields);
  if(name)prods=prods.filter(p=>(p.itemNo||'').toLowerCase().includes(name)||(p.name||'').toLowerCase().includes(name)||(p.importer||'').toLowerCase().includes(name));
  if(status)prods=prods.filter(p=>p.status===status);
  if(lockFilter==='none')prods=prods.filter(p=>!p.lockedBy);
  else if(lockFilter)prods=prods.filter(p=>p.lockedBy===lockFilter);
  if(pi)prods=prods.filter(p=>p.preInspect===pi);
  if(lb)prods=prods.filter(p=>p.labelStatus===lb);
  if(idv)prods=prods.filter(p=>p.importDecl===idv);
  const tbody=document.getElementById('product-tbody');
  if(tbody)tbody.innerHTML=renderProductRows(prods);
}
function showBulkUpdate(){
  const checkedIds=getCheckedIds();
  const targetCount=checkedIds.length>0?checkedIds.length:DB.products.length;
  const targetLabel=checkedIds.length>0?`선택된 ${targetCount}건`:`전체 ${targetCount}건`;
  const userOpts=Object.values(USERS).map(u=>`<option value="${u.id}">${u.name}</option>`).join('');
  showModal(`<h2>✏️ 일괄 수정</h2>
  <div class="${checkedIds.length>0?'alert-info':'alert-warn'}">
    ${checkedIds.length>0?`✅ <strong>선택된 ${targetCount}건</strong>을 수정합니다.`:`체크된 제품이 없어 <strong>전체 ${targetCount}건</strong>을 수정합니다.`}
    빈 칸으로 두면 해당 항목은 변경하지 않습니다.
  </div>
  <input type="hidden" id="bu-ids" value="${checkedIds.join(',')}">
  <div class="form-row">
    <div class="fg"><label>수입사</label><input id="bu-imp" placeholder="예: 코스트코"></div>

  </div>
  <div class="form-row">
    <div class="fg"><label>1단계 검토상태</label><select id="bu-status"><option value="">변경 안 함</option>${STATUSES.map(s=>`<option>${s}</option>`).join('')}</select></div>
    <div class="fg"><label>2단계 사전검사</label><select id="bu-pi"><option value="">변경 안 함</option>${PI_STATUSES.map(s=>`<option>${s}</option>`).join('')}</select></div>
  </div>
  <div class="form-row">
    <div class="fg"><label>검토파일 반영여부</label><select id="bu-pr"><option value="">변경 안 함</option>${PR_STATUSES.map(s=>`<option>${s}</option>`).join('')}</select></div>
    <div class="fg"><label>3단계 라벨</label><select id="bu-lb"><option value="">변경 안 함</option>${LABEL_STATUSES.map(s=>`<option>${s}</option>`).join('')}</select></div>
  </div>
  <div class="form-row">
    <div class="fg"><label>4단계 수입신고</label><select id="bu-id"><option value="">변경 안 함</option>${ID_STATUSES.map(s=>`<option>${s}</option>`).join('')}</select></div>
    <div></div>
  </div>
  <div class="modal-footer">
    <button class="btn btn-outline" onclick="closeModal()">취소</button>
    <button class="btn btn-warning" onclick="doBulkUpdate()">${targetLabel} 수정</button>
  </div>`);
}
function doBulkUpdate(){
  const imp=(document.getElementById('bu-imp').value||'').trim();
  const assignee=document.getElementById('bu-assignee').value;
  const status=document.getElementById('bu-status').value;
  const pi=document.getElementById('bu-pi').value;
  const pr=document.getElementById('bu-pr').value;
  const lb=document.getElementById('bu-lb').value;
  const idv=document.getElementById('bu-id').value;
  if(!imp&&!assignee&&!status&&!pi&&!pr&&!lb&&!idv){alert('수정할 항목을 하나 이상 선택하세요.');return;}
  const idsStr=(document.getElementById('bu-ids').value||'').trim();
  const targetIds=idsStr?idsStr.split(',').filter(Boolean):null;
  const targets=targetIds?DB.products.filter(p=>targetIds.includes(p.id)):DB.products;
  if(!confirm(`${targets.length}건을 수정하시겠습니까?`))return;
  targets.forEach(p=>{
    if(imp)p.importer=imp;
    if(assignee)p.assignee=assignee;
    if(status)p.status=status;
    if(pi)p.preInspect=pi;
    if(pr)p.preInspectReflect=pr;
    if(lb)p.labelStatus=lb;
    if(idv)p.importDecl=idv;
  });
  saveData(DB);closeModal();renderPage();
  alert(`✅ ${targets.length}건 수정 완료`);
}
function deleteProduct(id){
  if(!confirm('삭제하시겠습니까?'))return;
  DB.products=DB.products.filter(p=>p.id!==id);saveData(DB);renderPage();
}

function renderProductDetail(id){
  const p=ensureFields(getProduct(id)||{});
  if(!p.id)return`<div class="card"><p>제품을 찾을 수 없습니다.</p></div>`;
  const tabs=['기본정보','채팅방','파일관리','검토이력','AI검토보고서'];
  const tabHTML=`<div class="tabs">${tabs.map(t=>`<div class="tab ${t===currentTab?'active':''}" onclick="switchTab('${t}')">${t}</div>`).join('')}</div>`;
  let lockBanner='';
  if(p.lockedBy&&p.lockedBy!==currentUser.id)
    lockBanner=`<div class="lock-banner"><span>🔒</span><div><strong>${username(p.lockedBy)}</strong>님이 검토중입니다. (${p.lockTime})</div><button class="btn btn-warning btn-sm" style="margin-left:auto" onclick="forceUnlock('${id}')">강제 해제</button></div>`;
  let tabContent='';
  if(currentTab==='기본정보')tabContent=renderBasicInfo(p);

  return`

    <button class="btn btn-outline btn-sm" onclick="go('products')">← 목록</button>

  ${lockBanner}
  <div class="card" style="padding-bottom:0">${tabHTML}<div style="padding-bottom:20px">${tabContent}</div></div>`;
}

// STATUS CHANGE FUNCTIONS
function changeStatus(id,s){
  const p=getProduct(id);if(!p)return;
  if(p.lockedBy&&p.lockedBy!==currentUser.id){alert(`${username(p.lockedBy)}님이 검토중입니다.`);return;}
  const old=p.status;if(old===s)return;
  p.status=s;
  DB.history.push({id:uid(),productId:id,from:old,to:s,by:currentUser.id,at:nowStr(),note:''});
  if(s==='검토완료'){p.lockedBy=null;p.lockTime=null;}
  Object.values(USERS).forEach(u=>{if(u.id!==currentUser.id)addNotif(u.id,'status',`${p.name}: ${old}→${s}`,id);});
  saveData(DB);renderPage();
}
function changePI(id,s){
  const p=getProduct(id);if(!p)return;
  const old=p.preInspect;p.preInspect=s;
  if(s==='해당없음'||s==='-')p.preInspectReflect='검토파일미반영';
  DB.history.push({id:uid(),productId:id,from:`사전검사:${old}`,to:`사전검사:${s}`,by:currentUser.id,at:nowStr(),note:''});
  saveData(DB);renderPage();
}
function changePR(id,s){
  const p=getProduct(id);if(!p)return;
  const old=p.preInspectReflect;p.preInspectReflect=s;
  DB.history.push({id:uid(),productId:id,from:`반영:${old}`,to:`반영:${s}`,by:currentUser.id,at:nowStr(),note:''});
  saveData(DB);renderPage();
}
function changeLabel(id,s){
  const p=getProduct(id);if(!p)return;
  const old=p.labelStatus;p.labelStatus=s;
  DB.history.push({id:uid(),productId:id,from:`라벨:${old}`,to:`라벨:${s}`,by:currentUser.id,at:nowStr(),note:''});
  saveData(DB);renderPage();
}
function changeID(id,s){
  const p=getProduct(id);if(!p)return;
  const old=p.importDecl;p.importDecl=s;
  DB.history.push({id:uid(),productId:id,from:`수입신고:${old}`,to:`수입신고:${s}`,by:currentUser.id,at:nowStr(),note:''});
  saveData(DB);renderPage();
}
function savePreInspectDate(id,val){
  const p=getProduct(id);if(!p)return;
  p.preInspectDate=val;saveData(DB);
}
function startReview(id){
  const p=getProduct(id);if(!p)return;
  if(p.lockedBy){alert(`${username(p.lockedBy)}님이 검토중입니다.`);return;}
  p.lockedBy=currentUser.id;p.lockTime=nowStr();
  p.reviewedBy=currentUser.id;
  if(p.status==='검토예정'){
    const old=p.status;p.status='검토중';
    DB.history.push({id:uid(),productId:id,from:old,to:'검토중',by:currentUser.id,at:nowStr(),note:'검토 시작'});
  }
  saveData(DB);renderPage();
}
function changeLabelReview(id,s){
  const p=getProduct(id);if(!p)return;
  const old=p.labelReview;p.labelReview=s;
  DB.history.push({id:uid(),productId:id,from:`라벨검토:${old}`,to:`라벨검토:${s}`,by:currentUser.id,at:nowStr(),note:''});
  saveData(DB);renderPage();
}
function endReview(id){const p=getProduct(id);if(!p)return;p.lockedBy=null;p.lockTime=null;saveData(DB);renderPage();}
function forceUnlock(id){const p=getProduct(id);if(!p)return;p.lockedBy=null;p.lockTime=null;saveData(DB);renderPage();}
function toggleLockFromList(id){
  const p=getProduct(id);if(!p)return;
  if(p.lockedBy===currentUser.id){
    p.lockedBy=null;p.lockTime=null;
    saveData(DB);renderPage();
  } else if(!p.lockedBy){
    p.lockedBy=currentUser.id;p.lockTime=nowStr();
    p.reviewedBy=currentUser.id;
    if(p.status==='검토예정'){
      const old=p.status;p.status='검토중';
      DB.history.push({id:uid(),productId:id,from:old,to:'검토중',by:currentUser.id,at:nowStr(),note:'검토 시작'});
      Object.values(USERS).forEach(u=>{if(u.id!==currentUser.id)addNotif(u.id,'status',`${p.name}: ${old}→검토중`,id);});
    }
    saveData(DB);renderPage();
  }
}
function showChangeAssignee(id){
  const p=getProduct(id);
  const opts=Object.values(USERS).map(u=>`<option value="${u.id}" ${u.id===p.assignee?'selected':''}>${u.name}</option>`).join('');
  showModal(`<h2>담당자 변경</h2><div class="fg"><label>새 담당자</label><select id="newA">${opts}</select></div><div class="modal-footer"><button class="btn btn-outline" onclick="closeModal()">취소</button><button class="btn btn-primary" onclick="doChangeAssignee('${id}')">변경</button></div>`);
}
function doChangeAssignee(id){
  const p=getProduct(id);const newA=document.getElementById('newA').value;
  const old=p.assignee;p.assignee=newA;
  DB.history.push({id:uid(),productId:id,from:`담당:${username(old)}`,to:`담당:${username(newA)}`,by:currentUser.id,at:nowStr(),note:'담당자 변경'});
  addNotif(newA,'assign',`${p.name} 담당자로 지정되었습니다.`,id);

}

function showUploadModal(productId){
  showModal(`<h2>파일 업로드</h2>
    <div class="fg"><label>분류</label><select id="upCat">${FILE_CATS.map(c=>`<option>${c}</option>`).join('')}</select></div>
    <div class="fg"><label>파일명</label><input id="upName" placeholder="예: 성분표_최종.pdf"></div>
    <div class="modal-footer"><button class="btn btn-outline" onclick="closeModal()">취소</button><button class="btn btn-primary" onclick="doUpload('${productId}')">업로드</button></div>`);
}
function doUpload(productId){
  const cat=document.getElementById('upCat').value;
  const name=(document.getElementById('upName').value||'').trim();
  if(!name){alert('파일명을 입력하세요');return;}
  const existing=DB.files.filter(f=>f.productId===productId&&f.cat===cat);
  const version=existing.length?Math.max(...existing.map(f=>f.version))+1:1;
  DB.files.push({id:uid(),productId,cat,name,version,by:currentUser.id,at:nowStr()});
  const p=getProduct(productId);
  Object.values(USERS).forEach(u=>{if(u.id!==currentUser.id)addNotif(u.id,'file',`${p?p.name:'제품'}: 새 파일 (${cat})`,productId);});
  saveData(DB);closeModal();renderPage();
}
function deleteFile(fid,productId){
  if(!confirm('삭제?'))return;
  DB.files=DB.files.filter(f=>f.id!==fid);saveData(DB);renderPage();
}

function exportReport(id){

  const txt=`식품표시사항 검토보고서\n${'='.repeat(40)}\n제품명: ${p.name}\n아이템번호: ${p.itemNo||'—'}\n수입사: ${p.importer}\n식품유형: ${p.foodType}\n검토일: ${nowStr()}\n검토자: ${currentUser.name}\n\n[진행현황]\n1단계 검토: ${p.status}\n2단계 사전검사: ${p.preInspect} / 반영: ${p.preInspectReflect}\n3단계 라벨: ${p.labelStatus}\n4단계 수입신고: ${p.importDecl}\n\n[보완 요청사항]\n1. 트랜스지방 표시 추가 (필수)\n2. GMO 시험성적서 제출`;
  const blob=new Blob([txt],{type:'text/plain;charset=utf-8'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download=`검토보고서_${p.name}_${new Date().toISOString().slice(0,10)}.txt`;a.click();URL.revokeObjectURL(url);
}

function saveProduct(id){
  const itemNo=(document.getElementById('f-itemno').value||'').trim();
  const name=(document.getElementById('f-name').value||'').trim();
  const imp=(document.getElementById('f-imp').value||'').trim();
  if(!name){alert('제품명은 필수입니다.');return;}
  const ft=document.getElementById('f-ft').value;
  const assignee=document.getElementById('f-assignee').value;
  const priority=document.getElementById('f-priority').value;
  const note=(document.getElementById('f-note').value||'').trim();
  const pi=document.getElementById('f-pi').value;
  const pr=document.getElementById('f-pr').value;
  const lb=document.getElementById('f-lb').value;
  const idv=document.getElementById('f-id').value;
  if(id){
    const p=getProduct(id);const oldA=p.assignee;
    p.itemNo=itemNo;p.name=name;p.importer=imp;p.foodType=ft;p.assignee=assignee;p.priority=priority;p.note=note;
    p.preInspect=pi;p.preInspectReflect=pr;p.labelStatus=lb;p.importDecl=idv;
    const ns=document.getElementById('f-status')?.value;
    if(ns&&ns!==p.status){DB.history.push({id:uid(),productId:id,from:p.status,to:ns,by:currentUser.id,at:nowStr(),note:'정보수정'});p.status=ns;}
    if(assignee!==oldA)addNotif(assignee,'assign',`${name} 담당자로 지정되었습니다.`,id);
    saveData(DB);go('product',id);
  } else {
    const newId=uid();
    const today=new Date().toISOString().slice(0,10);
    DB.products.push({id:newId,itemNo,name,importer:imp,foodType:ft,registeredAt:today,assignee,priority,status:'검토예정',lockedBy:null,lockTime:null,note,preInspect:pi,preInspectDate:'',preInspectReflect:pr,labelStatus:lb,importDecl:idv});
    DB.history.push({id:uid(),productId:newId,from:'',to:'검토예정',by:currentUser.id,at:nowStr(),note:'제품 등록'});
    addNotif(assignee,'assign',`${name} 담당자로 지정되었습니다.`,newId);
    saveData(DB);go('product',newId);
  }
}

      <div class="fg"><label>검토상태</label><select id="s-status" onchange="doSearch()"><option value="">전체</option>${STATUSES.map(s=>`<option>${s}</option>`).join('')}</select></div>
      <div class="fg"><label>사전검사</label><select id="s-pi" onchange="doSearch()"><option value="">전체</option>${PI_STATUSES.map(s=>`<option>${s}</option>`).join('')}</select></div>
      <div class="fg"><label>수입신고</label><select id="s-id" onchange="doSearch()"><option value="">전체</option>${ID_STATUSES.map(s=>`<option>${s}</option>`).join('')}</select></div>
    </div>
    <table><tr><th>No.</th><th>제품명</th><th>수입사</th><th>담당자</th><th>1단계</th><th>2단계</th><th>3단계</th><th>4단계</th><th></th></tr>
    <tbody id="search-results">${renderSearchRows(DB.products.map(ensureFields))}</tbody></table>
  </div>`;
}
function renderSearchRows(prods){
  if(!prods.length)return`<tr><td colspan="9" class="empty">결과 없음</td></tr>`;
  return prods.map(p=>`<tr>
    <td style="font-size:11px;color:#64748b">${p.itemNo||'—'}</td>
    <td><strong style="cursor:pointer;color:#2563eb" onclick="go('product','${p.id}')">${p.name}</strong></td>
    <td style="font-size:11px">${p.importer}</td>
    <td style="font-size:12px">${username(p.assignee)}</td>
    <td>${sBadge(p.status)}</td>
    <td>${piBadge(p.preInspect)}</td>
    <td>${labelBadge(p.labelStatus)}</td>
    <td>${idBadge(p.importDecl)}</td>
    <td><button class="btn btn-outline btn-sm" onclick="go('product','${p.id}')">상세</button></td>
  </tr>`).join('');
}
function doSearch(){
  const name=(document.getElementById('s-name')||{}).value?.toLowerCase()||'';
  const imp=(document.getElementById('s-imp')||{}).value?.toLowerCase()||'';
  const assignee=(document.getElementById('s-assignee')||{}).value||'';
  const status=(document.getElementById('s-status')||{}).value||'';
  const pi=(document.getElementById('s-pi')||{}).value||'';
  const idv=(document.getElementById('s-id')||{}).value||'';
  let prods=DB.products.map(ensureFields);
  if(name)prods=prods.filter(p=>(p.itemNo||'').toLowerCase().includes(name)||(p.name||'').toLowerCase().includes(name)||(p.importer||'').toLowerCase().includes(name));
  if(assignee)prods=prods.filter(p=>p.assignee===assignee);
  if(status)prods=prods.filter(p=>p.status===status);
  if(pi)prods=prods.filter(p=>p.preInspect===pi);
  if(idv)prods=prods.filter(p=>p.importDecl===idv);
  const el=document.getElementById('search-results');if(el)el.innerHTML=renderSearchRows(prods);
}

function renderNotifications(){
  const my=DB.notifications.filter(n=>n.userId===currentUser.id).sort((a,b)=>b.at.localeCompare(a.at));
  const unread=my.filter(n=>!n.read).length;
  return`<div class="card">
    <div class="flex-between"><h3>🔔 알림 ${unread>0?`<span class="notif-count">${unread}</span>`:''}</h3>
      <button class="btn btn-outline btn-sm" onclick="markAllRead()">모두 읽음</button></div>
    ${my.length===0?'<div class="empty">알림이 없습니다.</div>':my.map(n=>`
    <div class="notif-item ${n.read?'':'unread'}" onclick="markRead('${n.id}','${n.productId||''}')">
      <div style="font-size:20px">${n.type==='chat'?'💬':n.type==='status'?'🔄':n.type==='assign'?'👤':'📎'}</div>
      <div style="flex:1"><div style="font-size:13px;font-weight:${n.read?400:600}">${n.msg}</div><div class="text-sm">${n.at}</div></div>
      ${!n.read?'<div style="width:8px;height:8px;background:#3b82f6;border-radius:50%;margin-top:4px;flex-shrink:0"></div>':''}
    </div>`).join('')}
  </div>`;
}
function markRead(nid,productId){
  const n=DB.notifications.find(x=>x.id===nid);if(n)n.read=true;saveData(DB);
  if(productId&&productId!=='undefined'){currentTab='기본정보';go('product',productId);}else renderPage();
}
function markAllRead(){DB.notifications.filter(n=>n.userId===currentUser.id).forEach(n=>n.read=true);saveData(DB);renderPage();}

// ============================================================
// GOOGLE SHEETS IMPORT
// ============================================================
let parsedCSVData=null;
function showImportModal(){
  showModal(`<h2>📥 구글 시트 데이터 가져오기</h2>
  <div class="alert-info">기존 구글 시트의 제품 목록을 불러옵니다. 중복 제품명은 자동으로 건너뜁니다.</div>
  <div style="display:flex;border-bottom:1px solid #e2e8f0;margin-bottom:14px">
    <div class="import-tab active" id="it-auto" onclick="switchImportTab('auto')">🔗 자동 불러오기</div>
    <div class="import-tab" id="it-manual" onclick="switchImportTab('manual')">📋 수동 붙여넣기</div>
  </div>
  <div id="import-auto">
    <div class="fg"><label>구글 시트 URL</label><input id="sheet-url" placeholder="https://docs.google.com/spreadsheets/d/..." style="font-size:11px"></div>
    <div class="alert-warn">⚠️ 시트가 <strong>공개(누구나 볼 수 있음)</strong>로 공유된 경우만 작동합니다.</div>
    <button class="btn btn-primary" onclick="fetchGoogleSheet()">🔄 불러오기</button>
    <div id="fetch-status" style="margin-top:10px;font-size:13px"></div>
  </div>
  <div id="import-manual" style="display:none">
    <div class="alert-info">구글 시트에서 전체 선택(Ctrl+A) → 복사(Ctrl+C) 후 아래에 붙여넣기</div>
    <div class="fg"><label>데이터 붙여넣기</label><textarea id="csv-paste" rows="6" placeholder="아이템번호&#9;제품명&#9;수입사..."></textarea></div>
    <button class="btn btn-primary btn-sm" onclick="parseManualCSV()">미리보기</button>
  </div>
  <div id="csv-preview-area" style="margin-top:12px"></div>
  <div class="modal-footer">
    <button class="btn btn-outline" onclick="closeModal()">취소</button>
    <button class="btn btn-success" id="import-btn" style="display:none" onclick="doImport()">✅ 가져오기 실행</button>
  </div>`);
}
function switchImportTab(tab){
  document.getElementById('it-auto').classList.toggle('active',tab==='auto');
  document.getElementById('it-manual').classList.toggle('active',tab==='manual');
  document.getElementById('import-auto').style.display=tab==='auto'?'block':'none';
  document.getElementById('import-manual').style.display=tab==='manual'?'block':'none';
}
async function fetchGoogleSheet(){
  const statusEl=document.getElementById('fetch-status');
  statusEl.innerHTML='<span style="color:#3b82f6">⏳ 불러오는 중...</span>';
  const urlInput=(document.getElementById('sheet-url').value||'').trim();
  const idMatch=urlInput.match(/\/d\/([a-zA-Z0-9_-]+)/);
  const gidMatch=urlInput.match(/gid=(\d+)/);
  if(!idMatch){statusEl.innerHTML='<div class="alert-warn">URL을 확인하세요.</div>';return;}
  const csvUrl=`https://docs.google.com/spreadsheets/d/${idMatch[1]}/export?format=csv${gidMatch?'&gid='+gidMatch[1]:''}`;
  try{
    const resp=await fetch(csvUrl);
    if(!resp.ok)throw new Error(`HTTP ${resp.status}`);
    const text=await resp.text();
    const parsed=parseCSV(text);
    parsedCSVData=parsed;
    statusEl.innerHTML=`<span style="color:#22c55e">✅ ${parsed.rows.length}개 행 성공!</span>`;
    showCSVPreview(parsed);
    document.getElementById('import-btn').style.display='inline-flex';
  }catch(err){
    statusEl.innerHTML=`<div class="alert-warn">❌ 자동 실패: ${err.message}<br>수동 붙여넣기 탭을 이용해주세요.</div>`;
  }
}
function parseCSV(text){
  const lines=text.split('\n').filter(l=>l.trim());
  const parse=line=>{
    const result=[];let current='';let inQ=false;
    for(let i=0;i<line.length;i++){
      const c=line[i];
      if(c==='"'){inQ=!inQ;}
      else if((c===','||c==='\t')&&!inQ){result.push(current.trim());current='';}
      else current+=c;
    }
    result.push(current.trim());return result;
  };
  const headers=parse(lines[0]);
  const rows=lines.slice(1).map(l=>parse(l));
  return{headers,rows};
}
function parseManualCSV(){
  const text=(document.getElementById('csv-paste').value||'').trim();
  if(!text){alert('데이터를 입력하세요.');return;}
  parsedCSVData=parseCSV(text);
  showCSVPreview(parsedCSVData);
  document.getElementById('import-btn').style.display='inline-flex';
}
function showCSVPreview(parsed){
  const{headers,rows}=parsed;
  const fieldOpts=`<option value="">무시</option><option value="itemNo">아이템번호</option><option value="name">제품명</option><option value="importer">수입사</option><option value="foodType">식품유형</option><option value="assignee">담당자</option><option value="status">검토상태</option><option value="preInspect">사전검사</option><option value="preInspectReflect">반영여부</option><option value="labelStatus">라벨상태</option><option value="importDecl">수입신고</option><option value="priority">우선순위</option><option value="registeredAt">등록일</option><option value="note">메모</option>`;
  const autoMap={};
  headers.forEach((h,i)=>{
    const hl=h.toLowerCase().replace(/\s/g,'');
    if(hl.includes('아이템')||hl.includes('itemno'))autoMap[i]='itemNo';
    else if(hl.includes('제품명')||hl.includes('상품명'))autoMap[i]='name';
    else if(hl.includes('수입사'))autoMap[i]='importer';
    else if(hl.includes('식품유형')||hl.includes('유형'))autoMap[i]='foodType';
    else if(hl.includes('담당자'))autoMap[i]='assignee';
    else if(hl.includes('상태')&&!hl.includes('사전')&&!hl.includes('신고'))autoMap[i]='status';
    else if(hl.includes('사전검사')&&!hl.includes('반영'))autoMap[i]='preInspect';
    else if(hl.includes('반영'))autoMap[i]='preInspectReflect';
    else if(hl.includes('라벨'))autoMap[i]='labelStatus';
    else if(hl.includes('수입신고')||hl.includes('신고'))autoMap[i]='importDecl';
    else if(hl.includes('우선순위'))autoMap[i]='priority';
    else if(hl.includes('등록일')||hl.includes('접수일'))autoMap[i]='registeredAt';
    else if(hl.includes('메모')||hl.includes('비고'))autoMap[i]='note';
  });
  document.getElementById('csv-preview-area').innerHTML=`<hr>
  <div style="font-size:13px;font-weight:600;margin-bottom:8px">미리보기 (처음 3행)</div>
  <div class="csv-preview"><table><tr>${headers.map(h=>`<th>${h}</th>`).join('')}</tr>
  ${rows.slice(0,3).map(r=>`<tr>${r.map(c=>`<td>${c||''}</td>`).join('')}</tr>`).join('')}</table></div>
  <div style="font-size:13px;font-weight:600;margin:10px 0 8px">컬럼 매핑</div>
  <div class="col-map">${headers.map((h,i)=>`<div class="fg"><label>${h}</label><select id="col-map-${i}">${fieldOpts}</select></div>`).join('')}</div>
  <div class="text-sm">전체 ${rows.length}행</div>`;
  headers.forEach((h,i)=>{const sel=document.getElementById(`col-map-${i}`);if(sel&&autoMap[i])sel.value=autoMap[i];});
}
function doImport(){
  if(!parsedCSVData){alert('데이터 없음');return;}
  const{headers,rows}=parsedCSVData;
  const mapping={};
  headers.forEach((h,i)=>{const sel=document.getElementById(`col-map-${i}`);if(sel&&sel.value)mapping[sel.value]=i;});
  if(!mapping.name){alert('제품명 컬럼을 지정하세요.');return;}
  let added=0,skipped=0;
  const existingNames=new Set(DB.products.map(p=>p.name.toLowerCase()));
  rows.forEach(row=>{
    const get=field=>mapping[field]!==undefined?(row[mapping[field]]||'').trim():'';
    const name=get('name');if(!name)return;
    if(existingNames.has(name.toLowerCase())){skipped++;return;}
    const assigneeName=get('assignee');
    let assigneeId=currentUser.id;
    Object.values(USERS).forEach(u=>{if(u.name===assigneeName)assigneeId=u.id;});
    const rawStatus=get('status');const status=STATUSES.includes(rawStatus)?rawStatus:'검토예정';
    const rawPI=get('preInspect');const preInspect=PI_STATUSES.includes(rawPI)?rawPI:'-';
    const rawPR=get('preInspectReflect');const preInspectReflect=PR_STATUSES.includes(rawPR)?rawPR:'검토파일미반영';
    const rawLB=get('labelStatus');const labelStatus=LABEL_STATUSES.includes(rawLB)?rawLB:'-';
    const rawID=get('importDecl');const importDecl=ID_STATUSES.includes(rawID)?rawID:'-';
    const rawPrio=get('priority');const priority=PRIORITIES.includes(rawPrio)?rawPrio:'보통';
    const newId=uid();
    DB.products.push({id:newId,itemNo:get('itemNo')||'',name,importer:get('importer')||'',foodType:get('foodType')||'기타',registeredAt:get('registeredAt')||new Date().toISOString().slice(0,10),assignee:assigneeId,priority,status,lockedBy:null,lockTime:null,note:get('note')||'',preInspect,preInspectDate:'',preInspectReflect,labelStatus,importDecl});
    DB.history.push({id:uid(),productId:newId,from:'',to:status,by:currentUser.id,at:nowStr(),note:'구글시트 이관'});
    existingNames.add(name.toLowerCase());added++;
  });
  saveData(DB);closeModal();
  alert(`✅ 이관 완료!\n추가: ${added}건 / 중복 건너뜀: ${skipped}건`);
  go('products');
}
