<!DOCTYPE html>
<html lang="ko">
<head>

<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Malgun Gothic',sans-serif;background:#f1f5f9;color:#1e293b;display:flex;height:100vh;overflow:hidden;}
#sidebar{width:220px;min-width:220px;background:#1e293b;color:#94a3b8;display:flex;flex-direction:column;height:100vh;overflow-y:auto;}
#sidebar .logo{padding:20px 16px;border-bottom:1px solid #334155;}
#sidebar .logo h2{color:#fff;font-size:13px;line-height:1.5;}
#sidebar .logo p{font-size:11px;color:#64748b;margin-top:2px;}
#sidebar nav a{display:flex;align-items:center;gap:10px;padding:10px 16px;cursor:pointer;font-size:13px;text-decoration:none;color:#94a3b8;transition:all .2s;}
#sidebar nav a:hover,#sidebar nav a.active{background:#334155;color:#fff;}
#sidebar nav a .icon{font-size:15px;width:18px;text-align:center;}
#sidebar nav .section-title{padding:12px 16px 4px;font-size:10px;text-transform:uppercase;letter-spacing:1px;color:#475569;}
#sidebar .user-area{padding:12px 16px;border-top:1px solid #334155;}
#sidebar .user-area select{width:100%;background:#334155;color:#fff;border:none;padding:6px 8px;border-radius:6px;font-size:12px;cursor:pointer;}
#sidebar .user-area .user-badge{font-size:11px;color:#64748b;margin-top:4px;}
#main{flex:1;display:flex;flex-direction:column;overflow:hidden;}
#topbar{background:#fff;border-bottom:1px solid #e2e8f0;padding:0 24px;height:52px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;}
#topbar h1{font-size:15px;font-weight:600;}
#topbar .tr{display:flex;align-items:center;gap:10px;}
#content{flex:1;overflow-y:auto;padding:20px 24px;}
/* STAT CARDS */
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:16px;}
.stat-card{background:#fff;border-radius:10px;padding:14px 16px;border-left:4px solid #3b82f6;cursor:pointer;transition:.15s;}
.stat-card:hover{box-shadow:0 2px 8px rgba(0,0,0,.1);}
.stat-card .val{font-size:26px;font-weight:700;}
.stat-card .lbl{font-size:11px;color:#64748b;margin-top:2px;line-height:1.3;}
/* BADGE */
.badge{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:600;white-space:nowrap;}
/* 검토 진행상태 */
.s-접수대기{background:#f1f5f9;color:#64748b;}
.s-자료수집중{background:#dbeafe;color:#1d4ed8;}
.s-검토중{background:#e0e7ff;color:#4338ca;}
.s-보완요청{background:#ffedd5;color:#c2410c;}
.s-보완회신대기{background:#fef9c3;color:#854d0e;}
.s-표시사항작성중{background:#f3e8ff;color:#7e22ce;}
.s-검토완료{background:#dcfce7;color:#15803d;}
.s-신고완료{background:#ccfbf1;color:#0f766e;}
/* 사전검사 진행여부 */
.pi-해당없음{background:#f1f5f9;color:#94a3b8;}
.pi-진행예정{background:#e0f2fe;color:#0369a1;}
.pi-진행중{background:#dbeafe;color:#1d4ed8;}
.pi-완료{background:#dcfce7;color:#15803d;}
/* 사전검사 반영여부 */
.pr-미반영{background:#fee2e2;color:#dc2626;}
.pr-반영중{background:#fef9c3;color:#854d0e;}
.pr-반영완료{background:#dcfce7;color:#15803d;}
/* 수입신고 */
.id-신고전{background:#f1f5f9;color:#64748b;}
.id-신고준비중{background:#e0f2fe;color:#0369a1;}
.id-신고완료{background:#dcfce7;color:#15803d;}
.id-보완요청{background:#ffedd5;color:#c2410c;}
.id-보완완료{background:#ccfbf1;color:#0f766e;}
.id-통관완료{background:#d1fae5;color:#065f46;}
/* priority */
.ph{background:#fee2e2;color:#dc2626;}
.pm{background:#fef9c3;color:#ca8a04;}
.pl{background:#f0fdf4;color:#16a34a;}
/* CARD */
.card{background:#fff;border-radius:10px;padding:18px 20px;margin-bottom:14px;box-shadow:0 1px 3px rgba(0,0,0,.05);}
.card h3{font-size:14px;font-weight:600;margin-bottom:12px;}
table{width:100%;border-collapse:collapse;font-size:12px;}
th{background:#f8fafc;padding:8px 10px;text-align:left;font-weight:600;color:#475569;border-bottom:1px solid #e2e8f0;white-space:nowrap;}
td{padding:8px 10px;border-bottom:1px solid #f1f5f9;color:#334155;vertical-align:middle;}
tr:hover td{background:#fafafa;}
/* BTN */
.btn{display:inline-flex;align-items:center;gap:5px;padding:7px 13px;border-radius:7px;font-size:13px;cursor:pointer;border:none;font-weight:500;transition:.15s;}
.btn-primary{background:#3b82f6;color:#fff;}.btn-primary:hover{background:#2563eb;}
.btn-danger{background:#ef4444;color:#fff;}.btn-danger:hover{background:#dc2626;}
.btn-success{background:#10b981;color:#fff;}.btn-success:hover{background:#059669;}
.btn-outline{background:#fff;color:#374151;border:1px solid #d1d5db;}.btn-outline:hover{background:#f9fafb;}
.btn-warning{background:#f59e0b;color:#fff;}.btn-warning:hover{background:#d97706;}
.btn-purple{background:#7c3aed;color:#fff;}.btn-purple:hover{background:#6d28d9;}
.btn-sm{padding:4px 10px;font-size:11px;}
/* FORM */
.fg{margin-bottom:12px;}
.fg label{display:block;font-size:11px;font-weight:600;color:#475569;margin-bottom:4px;}
.fg input,.fg select,.fg textarea{width:100%;padding:7px 10px;border:1px solid #d1d5db;border-radius:7px;font-size:13px;color:#1e293b;background:#fff;}
.fg input:focus,.fg select:focus,.fg textarea:focus{outline:none;border-color:#3b82f6;box-shadow:0 0 0 3px rgba(59,130,246,.1);}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.form-row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;}
/* TABS */
.tabs{display:flex;border-bottom:2px solid #e2e8f0;margin-bottom:18px;}
.tab{padding:9px 16px;cursor:pointer;font-size:13px;color:#64748b;border-bottom:2px solid transparent;margin-bottom:-2px;font-weight:500;}
.tab.active{color:#3b82f6;border-bottom-color:#3b82f6;}
/* CHAT */
.chat-box{height:360px;overflow-y:auto;background:#f8fafc;border-radius:8px;padding:12px;margin-bottom:10px;display:flex;flex-direction:column;gap:10px;}
.chat-msg{display:flex;gap:10px;max-width:70%;}
.chat-msg.mine{flex-direction:row-reverse;align-self:flex-end;}
.chat-msg .avatar{width:30px;height:30px;border-radius:50%;background:#3b82f6;color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0;}
.chat-msg .bubble{background:#fff;border-radius:12px;padding:8px 12px;box-shadow:0 1px 2px rgba(0,0,0,.08);}
.chat-msg.mine .bubble{background:#3b82f6;color:#fff;}
.chat-msg .name{font-size:11px;color:#64748b;margin-bottom:3px;}
.chat-msg.mine .name{text-align:right;}
.chat-msg .text{font-size:13px;line-height:1.5;}
.chat-msg .time{font-size:10px;color:#94a3b8;margin-top:3px;}
.chat-msg.mine .time{text-align:right;}
.chat-input-row{display:flex;gap:8px;}
.chat-input-row input{flex:1;padding:9px 12px;border:1px solid #d1d5db;border-radius:8px;font-size:13px;}
/* LOCK */
.lock-banner{background:#fef3c7;border:1px solid #fbbf24;border-radius:8px;padding:10px 14px;margin-bottom:14px;display:flex;align-items:center;gap:10px;font-size:13px;}
/* HISTORY */
.history-item{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid #f1f5f9;}
.history-item .dot{width:9px;height:9px;border-radius:50%;background:#3b82f6;margin-top:5px;flex-shrink:0;}
.history-item .meta{font-size:11px;color:#64748b;}
.history-item .desc{font-size:13px;margin-top:3px;}
/* FILES */
.file-cat{margin-bottom:14px;}
.file-cat h4{font-size:11px;font-weight:700;color:#475569;margin-bottom:6px;text-transform:uppercase;letter-spacing:.5px;}
.file-item{display:flex;align-items:center;justify-content:space-between;padding:7px 10px;background:#f8fafc;border-radius:6px;margin-bottom:4px;font-size:12px;}
.fver{background:#e0e7ff;color:#4338ca;font-size:10px;padding:1px 6px;border-radius:10px;font-weight:600;}
/* NOTIF */
.notif-item{display:flex;gap:12px;padding:11px;border-radius:8px;margin-bottom:6px;background:#fff;border:1px solid #e2e8f0;cursor:pointer;}
.notif-item.unread{border-left:3px solid #3b82f6;background:#f0f7ff;}
.notif-count{background:#ef4444;color:#fff;border-radius:10px;font-size:10px;padding:1px 5px;font-weight:700;}
/* AI */
.ai-section{background:#f8fafc;border-radius:8px;padding:12px;margin-bottom:10px;}
.ai-section h4{font-size:13px;font-weight:700;margin-bottom:8px;}
.ai-section ul{list-style:none;font-size:13px;}
.ai-section ul li{padding:3px 0;display:flex;gap:8px;}
/* WORKLOG */
.wl-user{background:#fff;border-radius:10px;padding:14px 16px;margin-bottom:10px;}
.wl-stats{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:10px;}
.wl-stat{background:#f1f5f9;padding:8px 14px;border-radius:8px;font-size:11px;text-align:center;}
.wl-stat .n{font-size:20px;font-weight:700;}
/* MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:1000;display:flex;align-items:center;justify-content:center;}
.modal{background:#fff;border-radius:12px;padding:22px;width:600px;max-width:95vw;max-height:90vh;overflow-y:auto;}
.modal h2{font-size:15px;font-weight:700;margin-bottom:14px;}
.modal-footer{display:flex;justify-content:flex-end;gap:8px;margin-top:18px;}
/* STATUS SECTION */
.status-section{background:#f8fafc;border-radius:8px;padding:14px;margin-bottom:14px;}
.status-section h4{font-size:12px;font-weight:700;color:#475569;margin-bottom:10px;text-transform:uppercase;letter-spacing:.5px;}
.status-btns{display:flex;gap:6px;flex-wrap:wrap;}
.status-btns button{padding:5px 12px;border-radius:20px;font-size:12px;cursor:pointer;border:2px solid transparent;font-weight:500;transition:.15s;}
.status-btns button:hover{opacity:.85;}
.status-btns button.selected{border-color:#1e293b;box-shadow:0 0 0 2px #1e293b;}
/* MISC */
.empty{text-align:center;padding:36px;color:#94a3b8;font-size:13px;}
.flex-between{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
.tag{display:inline-block;padding:1px 7px;border-radius:10px;font-size:11px;background:#e0e7ff;color:#3730a3;}
.chip{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:20px;font-size:11px;background:#f1f5f9;color:#475569;}
.lock-chip{background:#fef3c7;color:#92400e;}
hr{border:none;border-top:1px solid #e2e8f0;margin:14px 0;}
.text-sm{font-size:12px;color:#64748b;}
/* IMPORT MODAL */
.import-tabs{display:flex;gap:0;border-bottom:1px solid #e2e8f0;margin-bottom:14px;}
.import-tab{padding:8px 16px;cursor:pointer;font-size:13px;color:#64748b;border-bottom:2px solid transparent;margin-bottom:-1px;font-weight:500;}
.import-tab.active{color:#3b82f6;border-bottom-color:#3b82f6;}
.csv-preview{font-size:11px;overflow-x:auto;background:#f8fafc;border-radius:6px;padding:10px;max-height:200px;overflow-y:auto;}
.csv-preview table{font-size:11px;}
.csv-preview th{background:#e2e8f0;padding:4px 8px;}
.csv-preview td{padding:3px 8px;border-bottom:1px solid #f1f5f9;}
.col-map{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px;}
.col-map .fg{margin-bottom:6px;}
.alert-info{background:#eff6ff;border:1px solid #bfdbfe;border-radius:8px;padding:10px 12px;font-size:12px;color:#1d4ed8;margin-bottom:12px;}
.alert-warn{background:#fffbeb;border:1px solid #fde68a;border-radius:8px;padding:10px 12px;font-size:12px;color:#92400e;margin-bottom:12px;}
</style>
</head>
<body>

<div id="sidebar">
  <div class="logo">

// ============================================================
// UTILS
// ============================================================
function uid(){return 'id_'+Math.random().toString(36).substr(2,9)+'_'+Date.now();}
function nowStr(){const d=new Date();return `${d.getFullYear()}-${p2(d.getMonth()+1)}-${p2(d.getDate())} ${p2(d.getHours())}:${p2(d.getMinutes())}`;}
function p2(n){return String(n).padStart(2,'0');}
function username(id){return USERS[id]?USERS[id].name:id;}
function getProduct(id){return DB.products.find(p=>p.id===id);}
function canEdit(){return currentUser.role==='admin'||currentUser.role==='reviewer';}
function isAdmin(){return currentUser.role==='admin';}
function unreadCount(){return DB.notifications.filter(n=>n.userId===currentUser.id&&!n.read).length;}
function ensureFields(p){
  if(!p.preInspect)p.preInspect='해당없음';
  if(!p.preInspectReflect)p.preInspectReflect='미반영';
  if(!p.importDecl)p.importDecl='신고전';
  return p;
}
function addNotif(userId,type,msg,productId){
  DB.notifications.unshift({id:uid(),userId,type,msg,productId,read:false,at:nowStr()});
  saveData(DB);updateNotifBadge();
}
function updateNotifBadge(){
  const cnt=unreadCount();
  const el=document.getElementById('nav-notif');
  if(!el)return;
  const ex=el.querySelector('.notif-count');
  if(ex)ex.remove();
  if(cnt>0){const s=document.createElement('span');s.className='notif-count';s.style.marginLeft='auto';s.textContent=cnt;el.appendChild(s);}
}
function piBadge(v){return `<span class="badge pi-${v}">${v}</span>`;}
function prBadge(v){return `<span class="badge pr-${v}">${v}</span>`;}
function idBadge(v){return `<span class="badge id-${v}">${v}</span>`;}

// ============================================================
// ROUTER
// ============================================================
function go(page,arg){
  currentPage=page;currentProductId=arg||null;
  if(page!=='product')currentTab='기본정보';
  renderPage();
  document.querySelectorAll('#nav a[data-page]').forEach(a=>{
    a.classList.toggle('active',a.dataset.page===page);
  });
}
function renderPage(){
  document.getElementById('topbarDate').textContent=nowStr();
  const titles={dashboard:'대시보드',products:'제품 목록',register:currentProductId?'제품 수정':'제품 등록',search:'검색',worklog:'업무일지',notifications:'알림',product:'제품 상세'};
  document.getElementById('pageTitle').textContent=titles[currentPage]||'';
  const c=document.getElementById('content');
  if(currentPage==='dashboard')c.innerHTML=renderDashboard();
  else if(currentPage==='products')c.innerHTML=renderProductList();
  else if(currentPage==='product')c.innerHTML=renderProductDetail(currentProductId);
  else if(currentPage==='register')c.innerHTML=renderProductForm(currentProductId);
  else if(currentPage==='search')c.innerHTML=renderSearch();
  else if(currentPage==='notifications')c.innerHTML=renderNotifications();
  updateNotifBadge();
}
function refreshData(){DB=loadData()||DB;renderPage();}
function switchUser(id){
  currentUser=USERS[id];
  document.getElementById('userBadge').textContent='관리자 권한';
  renderPage();
}

function filterGo(field,val){
  go('products');
  setTimeout(()=>{
    if(field==='status'&&val){const el=document.getElementById('fl-status');if(el){el.value=val;filterList();}}
    else if(field==='preInspect'&&val){const el=document.getElementById('fl-pi');if(el){el.value=val;filterList();}}
    else if(field==='importDecl'){
      const el=document.getElementById('fl-id');
      if(el){
        if(val==='진행중')el.value='__id_progress';
        else if(val==='완료')el.value='__id_done';
        else el.value='신고전';
        filterList();
      }
    }
    else if(field==='piDoneNotReflect'){
      const el=document.getElementById('fl-pi');
      const el2=document.getElementById('fl-pr');
      if(el){el.value='완료';}
      if(el2){el2.value='미반영';}
      filterList();
    }
  },100);
}

function renderProductRows(prods){
  if(!prods.length)return`<tr><td colspan="10" class="empty">검색 결과가 없습니다.</td></tr>`;
  return prods.map(p=>`<tr>
    <td><strong style="cursor:pointer;color:#2563eb" onclick="go('product','${p.id}')">${p.name}</strong></td>
    <td style="font-size:11px">${p.importer}</td>
    <td><span class="tag" style="font-size:10px">${p.foodType}</span></td>
    <td style="font-size:12px">${username(p.assignee)}</td>
    <td><span class="badge s-${p.status}">${p.status}</span></td>
    <td>${piBadge(p.preInspect)}</td>
    <td>${p.preInspect==='해당없음'?'<span style="color:#94a3b8;font-size:11px">—</span>':prBadge(p.preInspectReflect)}</td>
    <td>${idBadge(p.importDecl)}</td>
    <td>${p.lockedBy?`<span class="chip lock-chip" style="font-size:10px">🔒${username(p.lockedBy)}</span>`:'<span class="chip" style="font-size:10px">🔓</span>'}</td>
    <td style="display:flex;gap:3px">
      <button class="btn btn-outline btn-sm" onclick="go('product','${p.id}')">상세</button>
      ${isAdmin()?`<button class="btn btn-danger btn-sm" onclick="deleteProduct('${p.id}')">삭</button>`:''}
    </td>
  </tr>`).join('');
}

function filterList(){
  const name=(document.getElementById('fl-name')||{}).value?.toLowerCase()||'';
  const status=(document.getElementById('fl-status')||{}).value||'';
  const assignee=(document.getElementById('fl-assignee')||{}).value||'';
  const pi=(document.getElementById('fl-pi')||{}).value||'';
  const pr=(document.getElementById('fl-pr')||{}).value||'';
  const idv=(document.getElementById('fl-id')||{}).value||'';
  let prods=DB.products.map(ensureFields);
  if(name) prods=prods.filter(p=>p.name.toLowerCase().includes(name)||p.importer.toLowerCase().includes(name));
  if(status) prods=prods.filter(p=>p.status===status);
  if(assignee) prods=prods.filter(p=>p.assignee===assignee);
  if(pi) prods=prods.filter(p=>p.preInspect===pi);
  if(pr) prods=prods.filter(p=>p.preInspectReflect===pr);
  if(idv==='__id_progress') prods=prods.filter(p=>['신고준비중','보완요청'].includes(p.importDecl));
  else if(idv==='__id_done') prods=prods.filter(p=>['신고완료','보완완료','통관완료'].includes(p.importDecl));
  else if(idv) prods=prods.filter(p=>p.importDecl===idv);
  const tbody=document.getElementById('product-tbody');
  if(tbody)tbody.innerHTML=renderProductRows(prods);
}

function deleteProduct(id){
  if(!isAdmin()){alert('관리자만 삭제 가능합니다.');return;}
  if(!confirm('삭제하시겠습니까?'))return;
  DB.products=DB.products.filter(p=>p.id!==id);saveData(DB);renderPage();
}

function renderProductDetail(id){
  const p=ensureFields(getProduct(id)||{});
  if(!p.id)return`<div class="card"><p>제품을 찾을 수 없습니다.</p></div>`;
  const tabs=['기본정보','채팅방','파일관리','검토이력','AI검토보고서'];
  const tabHTML=`<div class="tabs">${tabs.map(t=>`<div class="tab ${t===currentTab?'active':''}" onclick="switchTab('${t}')">${t}</div>`).join('')}</div>`;
  let lockBanner='';
  if(p.lockedBy&&p.lockedBy!==currentUser.id){
    lockBanner=`<div class="lock-banner"><span>🔒</span><div>현재 <strong>${username(p.lockedBy)}</strong>님이 검토중입니다. (시작: ${p.lockTime})</div>${isAdmin()?`<button class="btn btn-warning btn-sm" style="margin-left:auto" onclick="forceUnlock('${id}')">강제 해제</button>`:''}</div>`;
  }
  let tabContent='';
  if(currentTab==='기본정보')tabContent=renderBasicInfo(p);
  else if(currentTab==='채팅방')tabContent=renderChatTab(p.id);
  else if(currentTab==='파일관리')tabContent=renderFilesTab(p.id);

// Status change functions
function changeStatus(id,s){
  if(!canEdit()){alert('권한 없음');return;}
  const p=getProduct(id);if(!p)return;
  if(p.lockedBy&&p.lockedBy!==currentUser.id&&!isAdmin()){alert(`${username(p.lockedBy)}님이 검토중입니다.`);return;}
  const old=p.status;if(old===s)return;
  p.status=s;
  DB.history.push({id:uid(),productId:id,from:old,to:s,by:currentUser.id,at:nowStr(),note:''});
  if(['검토완료','신고완료'].includes(s)){p.lockedBy=null;p.lockTime=null;}
  Object.values(USERS).forEach(u=>{if(u.id!==currentUser.id)addNotif(u.id,'status',`${p.name}: ${old}→${s}`,id);});
  saveData(DB);renderPage();
}
function changePI(id,s){
  if(!canEdit())return;
  const p=getProduct(id);if(!p)return;
  const old=p.preInspect;p.preInspect=s;
  if(s==='해당없음')p.preInspectReflect='미반영';
  DB.history.push({id:uid(),productId:id,from:`사전검사:${old}`,to:`사전검사:${s}`,by:currentUser.id,at:nowStr(),note:''});
  saveData(DB);renderPage();
}
function changePR(id,s){
  if(!canEdit())return;
  const p=getProduct(id);if(!p)return;
  const old=p.preInspectReflect;p.preInspectReflect=s;
  DB.history.push({id:uid(),productId:id,from:`반영여부:${old}`,to:`반영여부:${s}`,by:currentUser.id,at:nowStr(),note:''});
  saveData(DB);renderPage();
}
function changeID(id,s){
  if(!canEdit())return;
  const p=getProduct(id);if(!p)return;
  const old=p.importDecl;p.importDecl=s;
  DB.history.push({id:uid(),productId:id,from:`수입신고:${old}`,to:`수입신고:${s}`,by:currentUser.id,at:nowStr(),note:''});
  saveData(DB);renderPage();
}

function startReview(id){
  const p=getProduct(id);if(!p)return;
  if(p.lockedBy){alert(`${username(p.lockedBy)}님이 검토중입니다.`);return;}
  p.lockedBy=currentUser.id;p.lockTime=nowStr();
  if(['접수대기','자료수집중'].includes(p.status)){
    const old=p.status;p.status='검토중';
    DB.history.push({id:uid(),productId:id,from:old,to:'검토중',by:currentUser.id,at:nowStr(),note:'검토 시작'});
  }
  saveData(DB);renderPage();
}
function endReview(id){const p=getProduct(id);if(!p)return;p.lockedBy=null;p.lockTime=null;saveData(DB);renderPage();}
function forceUnlock(id){if(!isAdmin())return;const p=getProduct(id);if(!p)return;p.lockedBy=null;p.lockTime=null;saveData(DB);renderPage();}
function showChangeAssignee(id){
  const p=getProduct(id);
  const opts=Object.values(USERS).filter(u=>u.role!=='viewer').map(u=>`<option value="${u.id}" ${u.id===p.assignee?'selected':''}>${u.name}</option>`).join('');
  showModal(`<h2>담당자 변경</h2><div class="fg"><label>새 담당자</label><select id="newA">${opts}</select></div><div class="modal-footer"><button class="btn btn-outline" onclick="closeModal()">취소</button><button class="btn btn-primary" onclick="doChangeAssignee('${id}')">변경</button></div>`);
}
function doChangeAssignee(id){
  const p=getProduct(id);const newA=document.getElementById('newA').value;
  const old=p.assignee;p.assignee=newA;
  DB.history.push({id:uid(),productId:id,from:`담당:${username(old)}`,to:`담당:${username(newA)}`,by:currentUser.id,at:nowStr(),note:'담당자 변경'});
  addNotif(newA,'assign',`${p.name} 담당자로 지정되었습니다.`,id);
  saveData(DB);closeModal();renderPage();
}

function renderChatTab(productId){
  const msgs=DB.chats.filter(c=>c.productId===productId).sort((a,b)=>a.at.localeCompare(b.at));
  return `
  <div class="chat-box" id="chatBox">
    ${msgs.length===0?'<div class="empty">아직 메시지가 없습니다.</div>':
      msgs.map(m=>{
        const mine=m.userId===currentUser.id;
        const colors=['#3b82f6','#10b981','#f59e0b','#8b5cf6'];
        const ci=Object.keys(USERS).indexOf(m.userId);
        const color=colors[ci%4];
        return `<div class="chat-msg ${mine?'mine':''}">
          <div class="avatar" style="background:${color}">${m.userName.charAt(0)}</div>
          <div><div class="name">${m.userName}</div>
          <div class="bubble"><div class="text">${m.msg}</div></div>
          <div class="time">${m.at}</div></div>
        </div>`;}).join('')}
  </div>
  ${canEdit()?`<div class="chat-input-row">
    <input id="chatInput" placeholder="메시지 입력..." onkeydown="if(event.key==='Enter')sendChat('${productId}')">
    <button class="btn btn-primary" onclick="sendChat('${productId}')">전송</button>
  </div>`:'<div class="text-sm">조회 전용 권한입니다.</div>'}`;
}
function sendChat(productId){
  if(!canEdit())return;
  const inp=document.getElementById('chatInput');
  const msg=(inp.value||'').trim();if(!msg)return;
  DB.chats.push({id:uid(),productId,userId:currentUser.id,userName:currentUser.name,msg,at:nowStr()});
  const p=getProduct(productId);
  Object.values(USERS).forEach(u=>{if(u.id!==currentUser.id)addNotif(u.id,'chat',`${currentUser.name}: ${msg.substring(0,25)}...`,productId);});
  saveData(DB);inp.value='';
  document.getElementById('content').innerHTML=renderProductDetail(productId);
  setTimeout(()=>{const cb=document.getElementById('chatBox');if(cb)cb.scrollTop=cb.scrollHeight;},50);
}

function renderFilesTab(productId){

    const cf=bycat[cat].sort((a,b)=>b.version-a.version);
    return `<div class="file-cat"><h4>${cat}</h4>
      ${cf.length===0?`<div class="text-sm" style="padding:4px 0">업로드된 파일 없음</div>`:
        cf.map(f=>`<div class="file-item">

          <div style="display:flex;align-items:center;gap:8px"><span class="text-sm">${username(f.by)} · ${f.at}</span>${canEdit()?`<button class="btn btn-danger btn-sm" onclick="deleteFile('${f.id}','${productId}')">삭제</button>`:''}</div>

function showUploadModal(productId){
  showModal(`<h2>파일 업로드</h2>
    <div class="fg"><label>분류</label><select id="upCat">${FILE_CATS.map(c=>`<option>${c}</option>`).join('')}</select></div>
    <div class="fg"><label>파일명</label><input id="upName" placeholder="예: 성분표_최종.pdf"></div>
    <div style="background:#f8fafc;border:2px dashed #d1d5db;border-radius:8px;padding:24px;text-align:center;margin-bottom:10px"><div style="font-size:28px">📂</div><div class="text-sm" style="margin-top:6px">파일명을 위에 입력하세요 (데모 환경)</div></div>
    <div class="modal-footer"><button class="btn btn-outline" onclick="closeModal()">취소</button><button class="btn btn-primary" onclick="doUpload('${productId}')">업로드</button></div>`);
}
function doUpload(productId){
  const cat=document.getElementById('upCat').value;
  const name=(document.getElementById('upName').value||'').trim();
  if(!name){alert('파일명 입력하세요');return;}
  const existing=DB.files.filter(f=>f.productId===productId&&f.cat===cat);
  const version=existing.length?Math.max(...existing.map(f=>f.version))+1:1;
  DB.files.push({id:uid(),productId,cat,name:name.includes('v')?name:`${name}_v${version}`,version,by:currentUser.id,at:nowStr()});
  const p=getProduct(productId);
  Object.values(USERS).forEach(u=>{if(u.id!==currentUser.id)addNotif(u.id,'file',`${p?p.name:'제품'}: 새 파일 업로드 (${cat})`,productId);});
  saveData(DB);closeModal();renderPage();
}
function deleteFile(fid,productId){
  if(!confirm('삭제?'))return;
  DB.files=DB.files.filter(f=>f.id!==fid);saveData(DB);renderPage();
}

function exportReport(id){
  const p=getProduct(id);
  const txt=`식품표시사항 검토보고서\n${'='.repeat(40)}\n제품명: ${p.name}\n수입사: ${p.importer}\n식품유형: ${p.foodType}\n검토일: ${nowStr()}\n검토자: ${currentUser.name}\n사전검사: ${p.preInspect} / 반영여부: ${p.preInspectReflect}\n수입신고: ${p.importDecl}\n\n[AI 자동 검토 결과]\n식품유형: 적합\n원재료명: 보완 필요\n알레르기: 적합\nGMO: 확인 필요\n영양성분: 트랜스지방 누락\n\n[보완 요청사항]\n1. 트랜스지방 표시 추가 (필수)\n2. 복합원재료 괄호 표기 확인\n3. GMO 시험성적서 제출\n4. 교차오염 주의문구 추가`;
  const blob=new Blob([txt],{type:'text/plain;charset=utf-8'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download=`검토보고서_${p.name}_${new Date().toISOString().slice(0,10)}.txt`;a.click();URL.revokeObjectURL(url);
}

      <button class="btn btn-primary" onclick="saveProduct('${p&&p.id?p.id:''}')">💾 ${p&&p.id?'저장':'등록'}</button>

function saveProduct(id){
  const name=(document.getElementById('f-name').value||'').trim();
  const imp=(document.getElementById('f-imp').value||'').trim();
  const ft=document.getElementById('f-ft').value;
  const assignee=document.getElementById('f-assignee').value;
  const priority=document.getElementById('f-priority').value;
  const note=(document.getElementById('f-note').value||'').trim();
  const pi=document.getElementById('f-pi').value;
  const pr=document.getElementById('f-pr').value;
  const idv=document.getElementById('f-id').value;
  if(!name||!imp){alert('제품명과 수입사는 필수입니다.');return;}
  if(id){
    const p=getProduct(id);const oldA=p.assignee;
    p.name=name;p.importer=imp;p.foodType=ft;p.assignee=assignee;p.priority=priority;p.note=note;
    p.preInspect=pi;p.preInspectReflect=pr;p.importDecl=idv;
    const ns=document.getElementById('f-status')?.value;
    if(ns&&ns!==p.status){DB.history.push({id:uid(),productId:id,from:p.status,to:ns,by:currentUser.id,at:nowStr(),note:'정보수정'});p.status=ns;}
    if(assignee!==oldA)addNotif(assignee,'assign',`${name} 담당자로 지정되었습니다.`,id);
    DB.history.push({id:uid(),productId:id,from:'수정',to:'완료',by:currentUser.id,at:nowStr(),note:'기본정보 수정'});
    saveData(DB);go('product',id);
  } else {
    const newId=uid();
    const today=new Date().toISOString().slice(0,10);
    DB.products.push({id:newId,name,importer:imp,foodType:ft,registeredAt:today,assignee,priority,status:'접수대기',lockedBy:null,lockTime:null,note,preInspect:pi,preInspectReflect:pr,importDecl:idv});
    DB.history.push({id:uid(),productId:newId,from:'',to:'접수대기',by:currentUser.id,at:nowStr(),note:'제품 등록'});
    addNotif(assignee,'assign',`${name} 담당자로 지정되었습니다.`,newId);
    saveData(DB);go('product',newId);
  }
}

function renderSearchRows(prods){
  if(!prods.length)return`<tr><td colspan="9" class="empty">결과 없음</td></tr>`;
  return prods.map(p=>`<tr>
    <td><strong style="cursor:pointer;color:#2563eb" onclick="go('product','${p.id}')">${p.name}</strong></td>
    <td>${p.importer}</td><td><span class="tag" style="font-size:10px">${p.foodType}</span></td><td>${username(p.assignee)}</td>
    <td><span class="badge s-${p.status}">${p.status}</span></td>
    <td>${piBadge(p.preInspect)}</td><td>${prBadge(p.preInspectReflect)}</td><td>${idBadge(p.importDecl)}</td>
    <td><button class="btn btn-outline btn-sm" onclick="go('product','${p.id}')">상세</button></td>
  </tr>`).join('');
}
function doSearch(){
  const name=(document.getElementById('s-name')||{}).value?.toLowerCase()||'';
  const imp=(document.getElementById('s-imp')||{}).value?.toLowerCase()||'';
  const ft=(document.getElementById('s-ft')||{}).value||'';
  const assignee=(document.getElementById('s-assignee')||{}).value||'';
  const status=(document.getElementById('s-status')||{}).value||'';
  const pi=(document.getElementById('s-pi')||{}).value||'';
  const pr=(document.getElementById('s-pr')||{}).value||'';
  const idv=(document.getElementById('s-id')||{}).value||'';
  let prods=DB.products.map(ensureFields);
  if(name)prods=prods.filter(p=>p.name.toLowerCase().includes(name));
  if(imp)prods=prods.filter(p=>p.importer.toLowerCase().includes(imp));
  if(ft)prods=prods.filter(p=>p.foodType===ft);
  if(assignee)prods=prods.filter(p=>p.assignee===assignee);
  if(status)prods=prods.filter(p=>p.status===status);
  if(pi)prods=prods.filter(p=>p.preInspect===pi);
  if(pr)prods=prods.filter(p=>p.preInspectReflect===pr);
  if(idv)prods=prods.filter(p=>p.importDecl===idv);
  const el=document.getElementById('search-results');if(el)el.innerHTML=renderSearchRows(prods);
}

function exportWorkLog(){
  const today=new Date().toISOString().slice(0,10);
  let txt=`업무일지 — ${today}\n${'='.repeat(40)}\n\n`;
  Object.values(USERS).filter(u=>u.role!=='viewer').forEach(u=>{
    const prods=DB.products.map(ensureFields).filter(p=>p.assignee===u.id);
    txt+=`【${u.name}】\n진행중: ${prods.filter(p=>!['검토완료','신고완료'].includes(p.status)).length}건\n완료: ${prods.filter(p=>['검토완료','신고완료'].includes(p.status)).length}건\n보완대기: ${prods.filter(p=>['보완요청','보완회신대기'].includes(p.status)).length}건\n사전검사미반영: ${prods.filter(p=>p.preInspect==='완료'&&p.preInspectReflect==='미반영').length}건\n\n`;
  });
  const blob=new Blob([txt],{type:'text/plain;charset=utf-8'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download=`업무일지_${today}.txt`;a.click();URL.revokeObjectURL(url);
}

let parsedCSVData=null; // {headers, rows}

function showImportModal(){
  showModal(`<h2>📥 구글 시트 데이터 가져오기</h2>
  <div class="alert-info">초기 데이터 이관: 기존 구글 시트의 제품 목록을 불러옵니다.<br>새로 불러온 데이터는 기존 데이터에 추가(병합)됩니다.</div>
  <div class="import-tabs">
    <div class="import-tab active" id="it-auto" onclick="switchImportTab('auto')">🔗 자동 불러오기</div>
    <div class="import-tab" id="it-manual" onclick="switchImportTab('manual')">📋 수동 붙여넣기</div>
  </div>
  <div id="import-auto">
    <div class="fg"><label>구글 시트 URL</label><input id="sheet-url" value="https://docs.google.com/spreadsheets/d/${SHEET_ID}/edit?gid=${SHEET_GID}#gid=${SHEET_GID}" style="font-size:11px"></div>
    <div class="alert-warn">⚠️ 자동 불러오기는 시트가 <strong>인터넷에 공개(누구나 볼 수 있음)</strong>로 공유된 경우에만 작동합니다.<br>비공개 시트는 수동 붙여넣기를 이용하세요.</div>
    <button class="btn btn-primary" onclick="fetchGoogleSheet()">🔄 불러오기 시도</button>
    <div id="fetch-status" style="margin-top:10px;font-size:13px"></div>
  </div>
  <div id="import-manual" style="display:none">
    <div class="alert-info">구글 시트에서 데이터를 복사(Ctrl+A → Ctrl+C)한 후 아래에 붙여넣기하세요.</div>
    <div class="fg"><label>CSV 또는 탭 구분 데이터</label><textarea id="csv-paste" rows="6" placeholder="제품명&#9;수입사&#9;식품유형&#9;담당자&#9;상태&#9;사전검사&#9;수입신고&#10;ABC Beef Jerky&#9;(주)한국식품&#9;육가공품&#9;김다진&#9;검토중&#9;완료&#9;신고준비중"></textarea></div>
    <button class="btn btn-primary btn-sm" onclick="parseManualCSV()">미리보기</button>
  </div>
  <div id="csv-preview-area" style="margin-top:12px"></div>
  <div class="modal-footer">
    <button class="btn btn-outline" onclick="closeModal()">취소</button>
    <button class="btn btn-success" id="import-btn" style="display:none" onclick="doImport()">✅ 가져오기 실행</button>
  </div>`);
}

function switchImportTab(tab){
  document.getElementById('it-auto').classList.toggle('active',tab==='auto');
  document.getElementById('it-manual').classList.toggle('active',tab==='manual');
  document.getElementById('import-auto').style.display=tab==='auto'?'block':'none';
  document.getElementById('import-manual').style.display=tab==='manual'?'block':'none';
}

async function fetchGoogleSheet(){
  const statusEl=document.getElementById('fetch-status');
  statusEl.innerHTML='<span style="color:#3b82f6">⏳ 불러오는 중...</span>';
  const urlInput=(document.getElementById('sheet-url').value||'').trim();
  // Extract sheet ID and gid from URL
  const idMatch=urlInput.match(/\/d\/([a-zA-Z0-9_-]+)/);
  const gidMatch=urlInput.match(/gid=(\d+)/);
  const sheetId=idMatch?idMatch[1]:SHEET_ID;
  const gid=gidMatch?gidMatch[1]:SHEET_GID;
  const csvUrl=`https://docs.google.com/spreadsheets/d/${sheetId}/export?format=csv&gid=${gid}`;
  try{
    const resp=await fetch(csvUrl);
    if(!resp.ok)throw new Error(`HTTP ${resp.status}`);
    const text=await resp.text();
    const parsed=parseCSV(text);
    parsedCSVData=parsed;
    statusEl.innerHTML=`<span style="color:#22c55e">✅ ${parsed.rows.length}개 행 불러오기 성공!</span>`;
    showCSVPreview(parsed);
    document.getElementById('import-btn').style.display='inline-flex';
  }catch(err){
    statusEl.innerHTML=`<div class="alert-warn">❌ 자동 불러오기 실패: ${err.message}<br>시트가 공개 공유되지 않았거나 CORS 제한이 있습니다.<br><strong>수동 붙여넣기 탭</strong>을 이용해주세요.</div>`;
  }
}

function parseCSV(text){
  const lines=text.split('\n').filter(l=>l.trim());
  const parse=line=>{
    const result=[];let current='';let inQ=false;
    for(let i=0;i<line.length;i++){
      const c=line[i];
      if(c==='"'){inQ=!inQ;}
      else if((c===','||c==='\t')&&!inQ){result.push(current.trim());current='';}
      else current+=c;
    }
    result.push(current.trim());
    return result;
  };
  const headers=parse(lines[0]);
  const rows=lines.slice(1).map(l=>parse(l));
  return{headers,rows};
}

function parseManualCSV(){
  const text=(document.getElementById('csv-paste').value||'').trim();
  if(!text){alert('데이터를 입력하세요.');return;}
  const parsed=parseCSV(text);
  parsedCSVData=parsed;
  showCSVPreview(parsed);
  document.getElementById('import-btn').style.display='inline-flex';
}

function showCSVPreview(parsed){
  const {headers,rows}=parsed;
  const previewRows=rows.slice(0,5);
  // Column mapping UI
  const fieldOpts=`<option value="">무시</option><option value="name">제품명</option><option value="importer">수입사</option><option value="foodType">식품유형</option><option value="assignee">담당자</option><option value="status">검토상태</option><option value="preInspect">사전검사</option><option value="preInspectReflect">반영여부</option><option value="importDecl">수입신고</option><option value="priority">우선순위</option><option value="registeredAt">등록일</option><option value="note">메모</option>`;
  // Auto-detect mapping
  const autoMap={};
  headers.forEach((h,i)=>{
    const hl=h.toLowerCase().replace(/\s/g,'');
    if(hl.includes('제품명')||hl.includes('상품명')||hl.includes('품목명'))autoMap[i]='name';
    else if(hl.includes('수입사')||hl.includes('수입자'))autoMap[i]='importer';
    else if(hl.includes('식품유형')||hl.includes('유형')||hl.includes('품목'))autoMap[i]='foodType';
    else if(hl.includes('담당자')||hl.includes('담당'))autoMap[i]='assignee';
    else if(hl.includes('상태')||hl.includes('진행상태'))autoMap[i]='status';
    else if(hl.includes('사전검사')&&!hl.includes('반영'))autoMap[i]='preInspect';
    else if(hl.includes('반영'))autoMap[i]='preInspectReflect';
    else if(hl.includes('수입신고')||hl.includes('신고'))autoMap[i]='importDecl';
    else if(hl.includes('우선순위')||hl.includes('우선'))autoMap[i]='priority';
    else if(hl.includes('등록일')||hl.includes('접수일')||hl.includes('날짜'))autoMap[i]='registeredAt';
    else if(hl.includes('메모')||hl.includes('비고'))autoMap[i]='note';
  });

  const previewHTML=`
  <hr>
  <div style="font-size:13px;font-weight:600;margin-bottom:10px">미리보기 (처음 5행)</div>
  <div class="csv-preview">
    <table><tr>${headers.map(h=>`<th>${h}</th>`).join('')}</tr>
    ${previewRows.map(r=>`<tr>${r.map(c=>`<td>${c||''}</td>`).join('')}</tr>`).join('')}</table>
  </div>
  <div style="font-size:13px;font-weight:600;margin-top:12px;margin-bottom:8px">컬럼 매핑 (자동 감지 — 수정 가능)</div>
  <div class="col-map">
    ${headers.map((h,i)=>`<div class="fg"><label>${h}</label><select id="col-map-${i}">
      ${fieldOpts.replace(`value="${autoMap[i]||''}"`,`value="${autoMap[i]||''}" selected`)}
    </select></div>`).join('')}
  </div>
  <div style="font-size:12px;color:#64748b;margin-top:4px">전체 ${rows.length}행 · 자동으로 중복 제품명은 건너뜁니다.</div>`;
  document.getElementById('csv-preview-area').innerHTML=previewHTML;
  // Set auto-detected values
  headers.forEach((h,i)=>{
    const sel=document.getElementById(`col-map-${i}`);
    if(sel&&autoMap[i])sel.value=autoMap[i];
  });
}

function doImport(){
  if(!parsedCSVData){alert('데이터가 없습니다.');return;}
  const {headers,rows}=parsedCSVData;
  const mapping={};
  headers.forEach((h,i)=>{
    const sel=document.getElementById(`col-map-${i}`);
    if(sel&&sel.value)mapping[sel.value]=i;
  });
  if(!mapping.name){alert('제품명 컬럼을 지정하세요.');return;}

  let added=0,skipped=0;
  const existingNames=new Set(DB.products.map(p=>p.name.toLowerCase()));

  rows.forEach(row=>{
    const get=field=>mapping[field]!==undefined?(row[mapping[field]]||'').trim():'';
    const name=get('name');
    if(!name)return;
    if(existingNames.has(name.toLowerCase())){skipped++;return;}

    // Map assignee name to user ID
    const assigneeName=get('assignee');
    let assigneeId=currentUser.id;
    Object.values(USERS).forEach(u=>{if(u.name===assigneeName)assigneeId=u.id;});

    // Map status
    const rawStatus=get('status');
    const status=STATUSES.includes(rawStatus)?rawStatus:'접수대기';

    // Map preInspect
    const rawPI=get('preInspect');
    const preInspect=PI_STATUSES.includes(rawPI)?rawPI:'해당없음';

    // Map preInspectReflect
    const rawPR=get('preInspectReflect');
    const preInspectReflect=PR_STATUSES.includes(rawPR)?rawPR:'미반영';

    // Map importDecl
    const rawID=get('importDecl');
    const importDecl=ID_STATUSES.includes(rawID)?rawID:'신고전';

    // Map priority
    const rawPrio=get('priority');
    const priority=PRIORITIES.includes(rawPrio)?rawPrio:'보통';

    const rawDate=get('registeredAt');
    const registeredAt=rawDate||new Date().toISOString().slice(0,10);

    const newId=uid();
    DB.products.push({
      id:newId,name,importer:get('importer')||'',foodType:get('foodType')||'기타',
      registeredAt,assignee:assigneeId,priority,status,lockedBy:null,lockTime:null,
      note:get('note')||'',preInspect,preInspectReflect,importDecl
    });
    DB.history.push({id:uid(),productId:newId,from:'',to:status,by:currentUser.id,at:nowStr(),note:'구글시트 이관'});
    existingNames.add(name.toLowerCase());
    added++;
  });

  saveData(DB);
  closeModal();
  alert(`✅ 이관 완료!\n추가: ${added}건\n중복 건너뜀: ${skipped}건`);
  go('products');
}

// ============================================================
// MODAL
// ============================================================
function showModal(html){
  document.getElementById('modalContainer').innerHTML=`<div class="modal-overlay" onclick="closeModal(event)"><div class="modal" onclick="event.stopPropagation()">${html}</div></div>`;
}
function closeModal(e){
  if(e&&e.target!==e.currentTarget)return;
  document.getElementById('modalContainer').innerHTML='';
}

// ============================================================
// INIT
// ============================================================
window.onload=function(){
  renderPage();updateNotifBadge();
  setInterval(()=>{const s=loadData();if(s&&JSON.stringify(s)!==JSON.stringify(DB)){DB=s;updateNotifBadge();}},5000);
};
</script>
