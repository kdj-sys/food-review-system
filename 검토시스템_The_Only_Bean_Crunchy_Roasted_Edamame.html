<style>
:root{
  --bg:#f5f6f8; --card:#ffffff; --ink:#1b1f24; --sub:#5f6b7a; --line:#e3e6ea;
  --blue:#2563eb; --blue-soft:#eaf1ff;
  --green:#178a4c; --green-soft:#e8f7ee;
  --amber:#b6650b; --amber-soft:#fff3e0;
  --red:#c62828; --red-soft:#fdeaea;
  --gray-soft:#eef0f2;
}
*{box-sizing:border-box;}
body{margin:0;font-family:"Pretendard","Malgun Gothic",-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink);line-height:1.55;}
.wrap{max-width:1080px;margin:0 auto;padding:28px 20px 80px;}
header{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px 26px;margin-bottom:20px;box-shadow:0 1px 3px rgba(0,0,0,.04);}
header h1{margin:0 0 4px;font-size:21px;letter-spacing:-.2px;}
.subtitle{color:var(--sub);font-size:13px;margin-bottom:12px;}
.subtitle b{color:var(--ink);}
.pill{display:inline-block;padding:5px 14px;border-radius:999px;font-size:13px;font-weight:600;background:var(--amber-soft);color:var(--amber);border:1px solid #f3d9ad;}
.hdr-actions{margin-top:14px;display:flex;gap:8px;flex-wrap:wrap;}
.btn{border:1px solid var(--line);background:#fff;color:var(--ink);font-size:12.5px;padding:7px 14px;border-radius:9px;cursor:pointer;}
.btn:hover{background:var(--gray-soft);}
.btn.primary{background:var(--blue);color:#fff;border-color:var(--blue);}
.btn.primary:hover{background:#1d4fd1;}

.card{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:14px;overflow:hidden;box-shadow:0 1px 2px rgba(0,0,0,.03);}
.card>summary{list-style:none;cursor:pointer;padding:15px 20px;display:flex;align-items:center;gap:10px;font-weight:600;font-size:14.5px;user-select:none;}
.card>summary::-webkit-details-marker{display:none;}
.card>summary .ico{font-size:16px;}
.card>summary .ttl{flex:1;}
.card>summary .right{font-size:12px;color:var(--sub);font-weight:500;}
.card>summary:after{content:"›";display:inline-block;transform:rotate(90deg);transition:.15s;color:var(--sub);font-size:16px;}
.card[open]>summary:after{transform:rotate(-90deg);}
.card .body{padding:0 20px 20px;border-top:1px solid var(--line);padding-top:14px;font-size:13px;}

table{border-collapse:collapse;width:100%;font-size:12.5px;margin:6px 0 14px;}
th,td{border:1px solid var(--line);padding:6px 9px;text-align:left;vertical-align:top;}
th{background:var(--gray-soft);font-weight:600;white-space:nowrap;}
td.num{text-align:right;font-variant-numeric:tabular-nums;}
.indent1{padding-left:20px;}
.indent2{padding-left:34px;}

.tag{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:6px;}
.tag.ok{background:var(--green-soft);color:var(--green);}
.tag.warn{background:var(--amber-soft);color:var(--amber);}
.tag.need{background:var(--red-soft);color:var(--red);}
.tag.na{background:var(--gray-soft);color:var(--sub);}

.mgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:10px 0 4px;}
@media(max-width:640px){.mgrid{grid-template-columns:repeat(2,1fr);}}
.mbox{border:1px solid var(--line);border-radius:10px;padding:9px 10px;font-size:11.5px;}
.mbox b{display:block;font-size:12.5px;margin-bottom:3px;}
.progwrap{background:var(--gray-soft);border-radius:8px;height:10px;overflow:hidden;margin:8px 0;}
.progbar{height:100%;background:linear-gradient(90deg,var(--blue),#60a5fa);}
.counts{display:flex;gap:14px;font-size:12.5px;margin-bottom:8px;}
.counts span b{font-size:15px;}

.flavorbar{display:flex;gap:8px;margin-bottom:14px;}
.fbtn{flex:1;text-align:center;padding:10px;border:1px solid var(--line);border-radius:12px;background:#fff;cursor:pointer;font-weight:600;font-size:13px;}
.fbtn.active{background:var(--blue-soft);border-color:var(--blue);color:var(--blue);}

.remark{color:var(--sub);font-size:11.5px;}
.warnrow{background:#fffaf0;}
ul.opin{margin:0;padding-left:18px;}
ul.opin li{margin-bottom:7px;}

.subtabs{display:flex;gap:6px;margin-bottom:10px;}
.subtab{padding:6px 14px;border:1px solid var(--line);border-radius:8px;background:#fff;cursor:pointer;font-size:12.5px;font-weight:600;color:var(--sub);}
.subtab.active{background:var(--ink);color:#fff;border-color:var(--ink);}
.subpane{display:none;}
.subpane.active{display:block;}
.gukmin-box{white-space:pre-wrap;background:var(--gray-soft);border-radius:10px;padding:16px;font-size:12.5px;line-height:1.7;}
.copybtn{margin-bottom:8px;}
.pending-note{background:var(--red-soft);color:var(--red);border-radius:8px;padding:9px 12px;font-size:12px;margin-bottom:10px;}

.hist-item{border-left:3px solid var(--line);padding:6px 0 6px 14px;margin-bottom:8px;font-size:12.5px;}
.hist-item.cur{border-left-color:var(--blue);}
.hist-item b{display:block;font-size:12px;color:var(--sub);}

.law-item{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px;}
.law-item a{color:var(--blue);font-size:12px;text-decoration:none;}
.law-item a:hover{text-decoration:underline;}

@media print{
  body{background:#fff;}
  .hdr-actions{display:none;}
  .card{break-inside:avoid;box-shadow:none;}
  details:not([open]) summary{background:#f0f0f0;}
}
</style>
</head>

    {date:"2026-07-10", desc:"최초 Costco Pre-Test 검토 — 제조업소 등록 확인, 성분코드 대부분 확정, 공정도·유통기한·제품사진 등 서류 보완요청."}

let curFlavor = COMMON.product.flavors[0];

function tag(status){
  const m = {ok:["ok","확보/OK"], warn:["warn","보완"], need:["need","미제출"], na:["na","해당없음"]};
  const [c,l] = m[status] || ["na", status];
  return `<span class="tag ${c}">${l}</span>`;
}

function card(id, ico, title, right, body, open){
  return `<details class="card" id="c_${id}" ${open?"open":""}>
    <summary><span class="ico">${ico}</span><span class="ttl">${title}</span><span class="right">${right||""}</span></summary>
    <div class="body">${body}</div>
  </details>`;
}

function progBody(){
  const total = COMMON.docs.length;
  const okCnt = COMMON.docs.filter(d=>d.status==="ok").length;
  const warnCnt = COMMON.docs.filter(d=>d.status==="warn").length;
  const needCnt = COMMON.docs.filter(d=>d.status==="need").length;
  const pct = Math.round(((okCnt*1 + warnCnt*0.5) / total) * 100);
  const grid = COMMON.modules.map(m=>`
    <div class="mbox"><b>${m.id} ${tag(m.status)}</b>${m.name}<br><span class="remark">${m.note}</span></div>
  `).join("");
  return `
    <div class="counts"><span>확보 <b>${okCnt}</b></span><span>보완 <b>${warnCnt}</b></span><span>미제출 <b>${needCnt}</b></span><span>전체 <b>${pct}%</b></span></div>
    <div class="progwrap"><div class="progbar" style="width:${pct}%"></div></div>
    <div class="mgrid">${grid}</div>
  `;
}

function infoBody(){
  const p = COMMON.product;
  return `
    <table>
      <tr><th>제품명</th><td>${p.nameKo}</td></tr>
      <tr><th>맛(SKU)</th><td>${p.flavors.join(" / ")}</td></tr>
      <tr><th>원산지</th><td>${p.origin}</td></tr>
      <tr><th>내용량</th><td>${p.netWt}</td></tr>
      <tr><th>Item#/Dept#</th><td>${p.itemDept}</td></tr>
      <tr><th>유통기한</th><td>${p.shelfLife}</td></tr>
    </table>
    <table>
      <tr><th>제조업소(M1)</th><td>${p.manufacturer}</td></tr>
      <tr><th>주소</th><td>${p.mfgAddr} <span class="remark">(Compliance Packet엔 "Wuzhong"으로 상이 기재 — 통일 확인요청)</span></td></tr>
      <tr><th>업소코드</th><td>${p.mfgCode}</td></tr>
      <tr><th>등록 유효기간</th><td>${p.mfgValid} · ${tag("ok")}</td></tr>
      <tr><th>HACCP/BRC 인증</th><td>자기기재(Registration Form) 주장 있으나 SMTING DB 미등록 ${tag("warn")}</td></tr>
    </table>
  `;
}

function docsBody(){
  const rows = COMMON.docs.map(d=>`<tr><td>${d.name}</td><td>${tag(d.status)}</td><td class="remark">${d.note}</td></tr>`).join("");
  return `<table><tr><th>서류</th><th>상태</th><th>비고</th></tr>${rows}</table>`;
}

function flavorBarHtml(){
  return `<div class="flavorbar">${COMMON.product.flavors.map(f=>
    `<div class="fbtn ${f===curFlavor?"active":""}" onclick="selFlavor('${f}')">${f} (${COMMON.product.flavorKo[f]})</div>`
  ).join("")}</div>`;
}

function procBody(){
  if(!COMMON.process.submitted){
    return `<p>${tag("need")} ${COMMON.process.note}</p>`;
  }
  return `<p>공정 플로우 및 CCP 표시 영역</p>`;
}

function ingBody(f){
  const rows = COMMON.ingredients[f].map(r=>{
    const indentCls = r.indent ? "indent1" : "";
    const rowCls = r.warn ? "warnrow" : "";
    return `<tr class="${rowCls}">
      <td>${r.no}</td><td class="${indentCls}">${r.raw}</td><td>${r.ko}</td>
      <td class="num">${r.pct}</td><td>${r.cls}</td><td>${r.code}</td>
      <td>${r.use}</td><td>${r.allergy}</td><td class="remark">${r.note}</td>
    </tr>`;
  }).join("");
  return `
    <table>
      <tr><th>#</th><th>성분표 원문</th><th>한국 라벨명</th><th>함량(%)</th><th>분류</th><th>성분코드</th><th>사용가능</th><th>알레르기</th><th>비고</th></tr>
      ${rows}
    </table>
  `;
}

function nutBody(f){
  const n = COMMON.nutrition[f];
  return `
    <table>
      <tr><th>열량</th><td>${n.cal}</td><th>탄수화물</th><td>${n.carb}</td></tr>
      <tr><th>지방</th><td>${n.fat}</td><th>당류</th><td>${n.sugar}</td></tr>
      <tr><th>포화지방</th><td>${n.sat}</td><th>나트륨</th><td>${n.sodium}</td></tr>
      <tr><th>트랜스지방</th><td>${n.trans}</td><th>단백질</th><td>${n.protein}</td></tr>
      <tr><th>콜레스테롤</th><td>${n.chol}</td><td></td><td></td></tr>
    </table>
    <p class="remark">⚠ ${n.note}</p>
  `;
}

function labelBody(){
  const l = COMMON.label;
  const req = (v) => v.includes("⚠") ? `<span style="color:var(--red)">${v}</span>` : v;
  return `
    <table>
      <tr><th>제품명</th><td>${req(l.productName)}</td></tr>
      <tr><th>식품유형</th><td>${req(l.foodType)}</td></tr>
      <tr><th>원재료명</th><td>${l.ingredientsStatement.join("<br>")}</td></tr>
      <tr><th>내용량</th><td>${l.netContent}</td></tr>
      <tr><th>원산지</th><td>${l.origin}</td></tr>
      <tr><th>보관방법</th><td>${l.storage}</td></tr>
      <tr><th>소비기한</th><td>${req(l.shelfLife)}</td></tr>
      <tr><th>알레르기</th><td>${l.allergy}</td></tr>
      <tr><th>GMO 표시</th><td>${req(l.gmo)}</td></tr>
      <tr><th>수입원</th><td>${req(l.importer)}</td></tr>
    </table>
  `;
}

function opBody(){
  return `<ul class="opin">${COMMON.opinions.map(o=>`<li>${o}</li>`).join("")}</ul>`;
}

function reqBody(){
  const list = COMMON.docs.filter(d=>d.status!=="ok").map(d=>`<li><b>${d.name}</b> — ${d.note}</li>`).join("");
  return `
    <div class="subtabs">
      <div class="subtab active" id="tab-req" onclick="showSub('req')">보완요청 목록</div>
      <div class="subtab" id="tab-guk" onclick="showSub('guk')">국민신문고 질의</div>
    </div>
    <div class="subpane active" id="pane-req"><ul class="opin">${list}</ul></div>
    <div class="subpane" id="pane-guk">
      ${!COMMON.gukmin.ready ? `<div class="pending-note">${COMMON.gukmin.pendingNote}</div>` : ""}
      <button class="btn copybtn" onclick="copyGukmin()">📋 질의문 복사</button>
      <div class="gukmin-box" id="gukminText">${COMMON.gukmin.draft}</div>
    </div>
  `;
}

function showSub(which){
  document.getElementById("tab-req").classList.toggle("active", which==="req");
  document.getElementById("tab-guk").classList.toggle("active", which==="guk");
  document.getElementById("pane-req").classList.toggle("active", which==="req");
  document.getElementById("pane-guk").classList.toggle("active", which==="guk");
}

function copyGukmin(){
  navigator.clipboard.writeText(COMMON.gukmin.draft).then(()=>alert("질의문이 복사되었습니다."));
}

function ftBody(){
  const rows = COMMON.foodType.rows.map(r=>`<tr><td>${r.item}</td><td>${r.value}</td><td class="remark">${r.note}</td></tr>`).join("");
  return `<table><tr><th>항목</th><th>값</th><th>비고</th></tr>${rows}</table>`;
}

function lawBody(){
  return COMMON.laws.map(l=>`<div class="law-item">${l.name} — <a href="${l.url}" target="_blank" rel="noopener">국가법령정보센터 원문 보기 ↗</a></div>`).join("");
}

function histBody(){
  return COMMON.history.map(h=>`<div class="hist-item ${h.cur?"cur":""}"><b>${h.date}</b>${h.desc}</div>`).join("");
}

function render(){
  const P = [];
  P.push(card("prog","📊","검토 진행률 · M1~M8","", progBody(), true));
  P.push(card("info","🏭","제품 정보 · 제조업소(M1)","", infoBody(), false));
  P.push(card("docs","📋","필수서류 체크리스트","", docsBody(), false));
  if(COMMON.product.flavors.length>1){
    P.push(`<div id="flavorbar">${flavorBarHtml()}</div>`);
  }
  P.push(card("proc","⚙️","제조공정 분석(M2)","", procBody(), false));
  P.push(`<div id="c_ing_wrap">${card("ing","🧪","성분 분석(M3)","", ingBody(curFlavor), false)}</div>`);
  P.push(`<div id="c_nut_wrap">${card("nut","🍎","영양성분(100g당)","", nutBody(curFlavor), false)}</div>`);
  P.push(card("label","🏷️","한글표시사항(M6)","", labelBody(), false));
  P.push(card("op","💬","종합의견(SMTING 생성)","", opBody(), true));
  P.push(card("req","📮","보완요청 · 국민신문고","", reqBody(), false));
  P.push(card("ft","📦","식품유형(M5)","", ftBody(), false));
  P.push(card("law","⚖️","근거 법규(M7)","", lawBody(), false));
  P.push(card("hist","🕓","검토 이력 · 변경이력","", histBody(), false));
  document.getElementById("cards").innerHTML = P.join("");
}

function selFlavor(f){
  curFlavor = f;
  document.getElementById("c_ing_wrap").innerHTML = card("ing","🧪","성분 분석(M3)","", ingBody(curFlavor), true);
  document.getElementById("c_nut_wrap").innerHTML = card("nut","🍎","영양성분(100g당)","", nutBody(curFlavor), true);
  document.getElementById("flavorbar").innerHTML = flavorBarHtml();
}

function setAll(open){
  document.querySelectorAll(".card").forEach(c => open ? c.setAttribute("open","") : c.removeAttribute("open"));
}

render();
</script>
